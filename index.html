<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Drip Store</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#040405; --card:rgba(255,255,255,.045); --card-s:#0d0d10; --card2:rgba(255,255,255,.07); --line:rgba(255,255,255,.11);
  --text:#f5f5f7; --muted:#85878f; --inv-bg:#f5f5f7; --inv-text:#050506; --inv-muted:#6a6c75;
  --glow:0 0 22px rgba(255,255,255,.14); --ic1:#ffffff; --ic2:#8d919c; --ok:#3ddc84; --warn:#f5b84a; --bad:#ff5a6e;
}
body.light{
  --bg:#eef0f4; --card:rgba(255,255,255,.75); --card-s:#ffffff; --card2:rgba(10,12,30,.05); --line:rgba(10,12,30,.1);
  --text:#0a0b10; --muted:#6b6e78; --inv-bg:#0b0c10; --inv-text:#f5f5f7; --inv-muted:#9a9ca6; --glow:0 0 0 1px rgba(10,12,30,.08); --ic1:#4a4d58; --ic2:#0a0b10;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:Manrope,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100%}
body{padding-bottom:120px;transition:background .3s,color .3s;overflow-x:hidden}
button{font-family:inherit;border:none;cursor:pointer;color:inherit;background:none}
input{font-family:inherit}
.h{font-family:Unbounded,Manrope,sans-serif}
svg{display:block}

/* ---------- фон: свечение + NFT-подарки ---------- */
.bgfx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bgfx i{position:absolute;border-radius:50%;filter:blur(100px);background:#fff;opacity:.07}
.bgfx i:nth-child(1){width:340px;height:340px;top:-160px;left:50%;margin-left:-170px}
.bgfx i:nth-child(2){width:260px;height:260px;bottom:-120px;right:-80px;opacity:.04}
body.light .bgfx i{opacity:.0}
.gifts{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.gifts img{position:absolute;width:118px;opacity:.11;filter:grayscale(1) brightness(1.15) contrast(1.05) drop-shadow(0 0 16px rgba(255,255,255,.35));animation:drift 16s ease-in-out infinite}
.gifts img:nth-child(1){top:4%;left:-22px;rotate:-12deg}
.gifts img:nth-child(2){top:2%;right:-18px;width:132px;rotate:10deg;animation-delay:-4s}
.gifts img:nth-child(3){top:30%;left:58%;width:84px;opacity:.07;animation-delay:-8s}
.gifts img:nth-child(4){top:45%;left:-30px;width:110px;rotate:8deg;animation-delay:-2s}
.gifts img:nth-child(5){top:60%;right:-26px;width:124px;rotate:-8deg;animation-delay:-11s}
.gifts img:nth-child(6){top:80%;left:18%;width:96px;opacity:.08;animation-delay:-6s}
.gifts img:nth-child(7){top:22%;left:20%;width:70px;opacity:.06;animation-delay:-9s}
.gifts img:nth-child(8){top:88%;right:20%;width:80px;opacity:.07;animation-delay:-13s}
.gifts::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 45%,rgba(4,4,5,.55),transparent 70%),linear-gradient(transparent 60%,var(--bg))}
body.light .gifts img{filter:grayscale(1) brightness(.5);opacity:.07}
body.light .gifts::after{background:none}
@keyframes drift{50%{translate:0 -12px}}

/* ---------- заставка ---------- */
#splash{position:fixed;inset:0;z-index:100;background:#040405;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .6s}
#splash.hide{opacity:0;pointer-events:none}
.robot{width:150px;filter:drop-shadow(0 0 16px rgba(255,255,255,.4));animation:float 2.4s ease-in-out infinite}
.robot .eye{transform-origin:center;transform-box:fill-box;animation:blink 3s infinite}
.robot .ant{animation:pulse 1.2s infinite}
.robot .scan{animation:scan 1.6s linear infinite}
.splash-name{font-family:Unbounded,sans-serif;font-weight:800;font-size:24px;letter-spacing:4px;color:#fff;text-shadow:0 0 14px rgba(255,255,255,.55),0 0 34px rgba(255,255,255,.2)}
.loadbar{width:170px;height:3px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.loadbar b{display:block;height:100%;width:40%;background:linear-gradient(90deg,transparent,#fff,transparent);animation:load 1.1s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes pulse{50%{opacity:.3}}
@keyframes scan{to{transform:translateY(26px)}}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}

/* ---------- водяные эффекты ---------- */
#ripples{position:fixed;inset:0;pointer-events:none;z-index:90}
.rip{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;border:1.5px solid rgba(255,255,255,.75);background:radial-gradient(circle,rgba(255,255,255,.25),transparent 70%);animation:rip .65s cubic-bezier(.2,.7,.3,1) forwards}
.rip.b{animation-delay:.09s;opacity:0;border-color:rgba(255,255,255,.4)}
body.light .rip{border-color:rgba(10,12,30,.45);background:radial-gradient(circle,rgba(10,12,30,.12),transparent 70%)}
@keyframes rip{0%{transform:scale(.3);opacity:1}100%{transform:scale(5.5);opacity:0}}
#liquid{position:fixed;inset:0;z-index:30;pointer-events:none;clip-path:circle(0 at var(--x,50%) var(--y,90%));
  backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px);background:rgba(255,255,255,.035)}
#liquid.in{transition:clip-path .42s cubic-bezier(.6,0,.3,1);clip-path:circle(150% at var(--x,50%) var(--y,90%))}
#liquid.out{transition:opacity .35s ease;opacity:0;clip-path:circle(150% at var(--x,50%) var(--y,90%))}
.view{animation:viewin .45s cubic-bezier(.2,.8,.2,1)}
@keyframes viewin{from{opacity:0;transform:translateY(10px) scale(.985);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}

/* ---------- каркас ---------- */
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:14px 16px}
.demo{font-size:11px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:6px;margin-bottom:12px}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:22px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 10px 30px rgba(0,0,0,.25)}
body.light .glass{background:var(--card);box-shadow:0 6px 20px rgba(10,12,30,.06)}
.tap{transition:transform .18s,border-color .2s}
.tap:active{transform:scale(.97)}
.chev{width:18px;height:18px;color:var(--muted);flex-shrink:0}

.hdr{display:flex;align-items:center;justify-content:space-between;gap:10px}
.me{display:flex;align-items:center;gap:10px;min-width:0;text-align:left}
.me b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.rk{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--muted)}
.rk svg{width:13px;height:13px}
.ava{width:44px;height:44px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-weight:800;color:#fff;overflow:hidden;
  background:linear-gradient(135deg,#2b2c33,#6d707c) center/cover;border:1px solid rgba(255,255,255,.25);box-shadow:var(--glow)}
.balpill{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 14px;border-radius:22px;font-size:12px;color:var(--muted);white-space:nowrap}
.balpill b{color:var(--text);font-size:15px}
.balpill i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--inv-bg);color:var(--inv-text);font-style:normal;box-shadow:0 0 14px rgba(255,255,255,.35)}
.balpill i svg{width:16px;height:16px}

.hero{text-align:center;padding:30px 0 26px}
.orb{width:84px;height:84px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;color:var(--text);
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.25),rgba(255,255,255,.03) 60%);border:1px solid rgba(255,255,255,.22);
  box-shadow:0 0 40px rgba(255,255,255,.18),inset 0 0 20px rgba(255,255,255,.08)}
.orb svg{width:40px;height:40px;filter:drop-shadow(0 0 10px rgba(255,255,255,.7))}
.hero h1{font-family:Unbounded,sans-serif;font-size:24px;font-weight:800;display:inline-flex;align-items:center;gap:8px;letter-spacing:.5px}
.vb{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--inv-bg);color:var(--inv-text);box-shadow:0 0 12px rgba(255,255,255,.4)}
.vb svg{width:13px;height:13px}
.hero p{color:var(--muted);font-size:13px;margin-top:6px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pc{position:relative;padding:16px;text-align:left;display:flex;flex-direction:column;min-height:150px}
.pc .ic{width:52px;height:52px;margin-bottom:auto;filter:drop-shadow(0 0 14px rgba(255,255,255,.2))}
.pc .t{font-weight:800;font-size:14.5px;margin-top:16px}
.pc .d{font-size:11.5px;color:var(--muted);margin-top:3px}
.pc .chev{position:absolute;right:14px;top:50%;margin-top:-9px}
.badge{position:absolute;top:12px;right:12px;font-size:9px;font-weight:800;letter-spacing:1px;padding:4px 7px;border-radius:7px;background:var(--inv-bg);color:var(--inv-text)}
.wide{display:flex;align-items:center;gap:14px;padding:16px;margin-top:12px;width:100%;text-align:left}
.wide .wi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--card2);flex-shrink:0}
.wide .wi svg{width:24px;height:24px}
.wide .wt{flex:1}.wide .wt b{display:block;font-size:14.5px}.wide .wt span{font-size:11.5px;color:var(--muted)}
.pill{font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:8px;background:var(--card2);color:var(--muted)}

.slot,.slotfb svg{width:100%;height:100%;object-fit:contain}
.mini{display:inline-block;width:16px;height:16px;vertical-align:-3px;margin-right:4px}

/* ---------- списки, карточки ---------- */
.card{border-radius:20px}
.row{display:flex;align-items:center;gap:12px;padding:14px;width:100%;text-align:left}
.row+.row{border-top:1px solid var(--line)}
.ri{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--card2);flex-shrink:0;color:var(--text)}
.ri svg{width:20px;height:20px}.ri .mini{width:22px;height:22px;margin:0}
.rt{flex:1;min-width:0}.rt b{display:block;font-size:14px}.rt span{font-size:11.5px;color:var(--muted)}
.sw{width:44px;height:26px;border-radius:20px;background:var(--card2);border:1px solid var(--line);position:relative;flex-shrink:0;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:all .2s}
.sw.on{background:rgba(255,255,255,.18);border-color:var(--text)}
.sw.on::after{left:21px;background:var(--text);box-shadow:0 0 8px rgba(255,255,255,.6)}
.cap{font-size:11px;font-weight:800;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin:22px 4px 9px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:16px}
.seg button{padding:11px;border-radius:12px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--inv-bg);color:var(--inv-text);box-shadow:0 0 16px rgba(255,255,255,.22)}
.title{display:flex;align-items:center;gap:12px;margin:6px 0 18px}
.title h2{font-size:22px;font-weight:800}
.back{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
.back svg{width:20px;height:20px}

/* ---------- профиль и ранги ---------- */
.prof{padding:22px 18px;text-align:center}
.prof .ava{width:86px;height:86px;font-size:30px;margin:0 auto 12px;box-shadow:0 0 0 3px var(--bg),0 0 0 4px rgba(255,255,255,.4),0 0 30px rgba(255,255,255,.25)}
.prof b{font-size:19px}
.prof .un{color:var(--muted);font-size:13px;margin-top:2px}
.idc{display:inline-flex;gap:6px;align-items:center;margin-top:10px;font-size:11px;font-family:monospace;color:var(--muted);background:var(--card2);padding:5px 10px;border-radius:9px}
.idc svg{width:12px;height:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stats div{background:var(--card2);border-radius:14px;padding:11px 8px}
.stats span{font-size:9.5px;font-weight:800;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.stats b{display:block;font-size:14px;margin-top:3px}
.rank{padding:18px}
.rank-top{display:flex;align-items:center;gap:14px}
.rbig{width:54px;height:54px;flex-shrink:0;color:var(--text);filter:drop-shadow(0 0 10px rgba(255,255,255,.35))}
.rank-top small{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:1px;text-transform:uppercase}
.rank-top b{display:block;font-family:Unbounded,sans-serif;font-size:19px}
.bar{height:8px;border-radius:8px;background:var(--card2);margin:16px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#8d909a,#fff);box-shadow:0 0 12px rgba(255,255,255,.5);transition:width .8s}
.rank-note{font-size:12px;color:var(--muted)}
.rw{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin-top:14px}
.eb{display:inline-block;vertical-align:-2px;margin-left:4px;filter:drop-shadow(0 0 6px rgba(255,255,255,.5))}.eb svg{width:100%;height:100%}
body.light .eb{filter:drop-shadow(0 1px 3px rgba(10,12,30,.35))}
.elnote{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:11.5px;color:var(--muted)}.elnote .eb{margin:0}
.rw div{flex:1;padding:11px;border-radius:14px;background:var(--card2);font-size:11.5px}
.rw div b{display:block;font-size:12.5px;margin-bottom:6px}
.rw button{width:100%;padding:8px;border-radius:10px;font-weight:800;font-size:12px;background:var(--inv-bg);color:var(--inv-text)}
.rw button:disabled{background:transparent;color:var(--muted);border:1px solid var(--line)}
.rlist .row .ri svg{width:24px;height:24px}

/* ---------- рейтинг ---------- */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end;margin:26px 0 14px}
.pod{text-align:center}
.pod .pa{width:52px;height:52px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;font-family:Unbounded,sans-serif;font-weight:800;font-size:20px;
  background:linear-gradient(135deg,#d8dae0,#7c7f89);color:#050506;box-shadow:0 0 18px rgba(255,255,255,.3)}
.pod.p1 .pa{width:62px;height:62px;background:linear-gradient(135deg,#fff,#b9bcc6);box-shadow:0 0 28px rgba(255,255,255,.55)}
.pod .crown{width:22px;height:22px;margin:0 auto 4px;color:#fff;filter:drop-shadow(0 0 6px #fff)}
.pod b{font-size:13px;display:block}
.pod small{font-size:10.5px;color:var(--muted)}
.pod .blk{margin-top:8px;border-radius:14px 14px 6px 6px;display:grid;place-items:center;font-weight:800;font-size:14px;gap:2px}
.pod.p1 .blk{height:104px}.pod.p2 .blk{height:76px}.pod.p3 .blk{height:60px}
.lb .row .ri{font-weight:800;font-size:14px}
.lb .num{font-weight:800}

/* ---------- пополнение ---------- */
.balcard{padding:18px 20px;margin-bottom:6px}
.balcard small{font-size:11px;font-weight:800;letter-spacing:1.5px;color:var(--muted)}
.balcard b{display:block;font-family:Unbounded,sans-serif;font-size:30px;margin-top:6px}
.balcard b span{font-family:Manrope;font-size:14px;color:var(--muted);font-weight:700}
.meths{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.meth{padding:14px;text-align:left;display:flex;flex-direction:column;gap:10px}
.meth .ml{display:flex;align-items:center;gap:10px}
.meth .mi{width:40px;height:40px;flex-shrink:0;display:grid;place-items:center;color:var(--text)}
.meth .mi svg{width:30px;height:30px}
.meth b{display:block;font-size:14px;letter-spacing:.5px}
.meth span{font-size:11px;color:var(--muted)}
.status{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot.g{background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 1.6s infinite}
.dot.y{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.dot.r{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.minrow{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin:10px 2px 0}
.minrow button{color:var(--text);font-weight:700;font-size:12px;display:flex;align-items:center;gap:2px}
.minrow button svg{width:14px;height:14px}
.selm{display:flex;align-items:center;gap:12px;padding:14px}
.selm .mi{width:40px;height:40px;display:grid;place-items:center}.selm .mi svg{width:30px;height:30px}
.selm .rt b{letter-spacing:.5px}
.selm button{padding:8px 14px;border-radius:12px;border:1px solid var(--line);font-size:12px;font-weight:700}
.lbl2{font-size:12.5px;font-weight:700;color:var(--muted);margin:18px 2px 8px}
.inpw{position:relative}
.inp{width:100%;padding:15px 16px;border-radius:16px;background:var(--card-s);border:1px solid var(--line);color:var(--text);font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s}
.inp:focus{border-color:rgba(255,255,255,.6);box-shadow:0 0 18px rgba(255,255,255,.12)}
.inpw .inp{padding-right:56px;font-size:18px;font-weight:700}
.inpw span{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.chips button{padding:12px 4px;border-radius:14px;font-size:14px;font-weight:800}
.steps .row{gap:14px;padding:13px 14px}
.steps .n{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--card2);flex-shrink:0}
.steps .row span{font-size:13px;color:var(--text);line-height:1.4}
.paybox{background:var(--inv-bg);color:var(--inv-text);border-radius:20px;padding:4px 16px;box-shadow:0 0 30px rgba(255,255,255,.12)}
.pl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0}
.pl+.pl{border-top:1px solid rgba(128,128,140,.25)}
.pl span{font-size:12px;color:var(--inv-muted)}
.pl b{font-size:16px;letter-spacing:.5px}
.pl .big{font-family:Unbounded,sans-serif;font-size:19px}
.cp{padding:8px;border-radius:10px;background:var(--bg);color:var(--text);flex-shrink:0}.cp svg{width:15px;height:15px}
.warn{display:flex;gap:10px;margin:14px 0;padding:12px 14px;border-radius:14px;font-size:12.5px;line-height:1.45;background:var(--card2);border:1px solid var(--line)}
.warn svg{width:18px;height:18px;flex-shrink:0;margin-top:1px}
.timer{text-align:center;color:var(--muted);font-size:13px;margin-bottom:12px}
.timer b{color:var(--text);font-family:monospace;font-size:15px}
.btn{width:100%;padding:16px;border-radius:16px;font-weight:800;font-size:15px;background:var(--inv-bg);color:var(--inv-text);box-shadow:0 0 24px rgba(255,255,255,.18);transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.35;box-shadow:none}
.btn>svg{width:18px;height:18px;vertical-align:-4px;margin-right:6px}
.walbtn{display:block;margin:18px auto 0;padding:7px 14px;border-radius:12px;font-size:12px;font-weight:700;color:var(--muted);background:var(--card2);border:1px solid var(--line)}
.walbtn svg{width:14px;height:14px;vertical-align:-2px;margin-right:4px}
.wal .big{font-size:30px;font-weight:900;margin:6px 0 2px}.wal .row2{display:flex;justify-content:space-between;padding:10px 2px;border-bottom:1px solid var(--line);font-size:14px}
.wal .row2 span{color:var(--muted)}.wal .note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.4}
.btn.ghost{background:var(--card2);color:var(--text);box-shadow:none;border:1px solid var(--line)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(128,128,128,.35);border-top-color:currentColor;border-radius:50%;animation:rot .7s linear infinite;vertical-align:-3px;margin-right:8px}

/* ---------- история ---------- */
.foot{text-align:center;margin:30px 0 6px;color:var(--muted);font-size:12px;line-height:1.7}

.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty svg{width:58px;height:58px;margin:0 auto 12px;opacity:.7}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.st{font-size:10.5px;font-weight:800;padding:4px 8px;border-radius:8px;background:var(--card2);display:inline-block;margin-top:3px}

/* ---------- игры ---------- */
.gcard{display:flex;align-items:center;gap:14px;padding:14px;margin-bottom:10px;width:100%;text-align:left}
.gcard .gi{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.18),rgba(255,255,255,.03));border:1px solid var(--line);flex-shrink:0}

#game{position:fixed;inset:0;z-index:60;background:#030304;display:none;flex-direction:column;touch-action:none}

.ghead .gs{font-weight:800;font-size:15px;min-width:60px;text-align:right}
.ghead button{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.08);color:#fff}
.ghead button svg{width:18px;height:18px}
.garea{position:relative;flex:1;overflow:hidden}
.ghint{position:absolute;left:0;right:0;bottom:24px;text-align:center;color:rgba(255,255,255,.4);font-size:12px;pointer-events:none}
.gover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(3,3,4,.75);backdrop-filter:blur(8px);color:#fff;text-align:center;padding:30px;animation:viewin .35s}
.gover h3{font-family:Unbounded,sans-serif;font-size:22px}
.gover .sc{font-family:Unbounded,sans-serif;font-size:44px;font-weight:800;text-shadow:0 0 20px rgba(255,255,255,.6)}
.gover p{color:#888;font-size:13px;margin-bottom:10px}
.gover .btn{max-width:260px;background:#fff;color:#000}
.gover .btn.ghost{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.15)}
.g2048{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:min(92vw,380px);aspect-ratio:1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
.g2048 div{border-radius:12px;display:grid;place-items:center;font-family:Unbounded,sans-serif;font-weight:800;background:rgba(255,255,255,.04);color:#fff;transition:background .15s}
.g2048 div.pop{animation:pop .18s}
@keyframes pop{50%{transform:scale(1.1)}}

/* ---------- нижнее меню ---------- */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:20;width:calc(100% - 28px);max-width:492px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;gap:2px;padding:6px;border-radius:26px;
  background:rgba(14,14,17,.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.4)}

nav svg{width:22px;height:22px}

nav button.mid{background:var(--inv-bg);color:var(--inv-text);padding:10px 2px;box-shadow:0 0 22px rgba(255,255,255,.3)}

/* ---------- нижняя панель ---------- */
#back{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
#back.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:520px;margin:0 auto;max-height:90vh;overflow-y:auto;background:var(--bg);border-radius:26px 26px 0 0;border-top:1px solid rgba(255,255,255,.25);
  box-shadow:0 -10px 40px rgba(255,255,255,.07);padding:10px 18px 28px;transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.9,.3,1)}

.sh-title{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sh-title .ic{width:46px;height:46px;flex-shrink:0}

.pk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pk button{padding:12px 6px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:center}
.pk button b{display:block;font-size:15px}.pk button span{font-size:11px;color:var(--muted)}
.pk button.on,.pm button.on{border-color:rgba(255,255,255,.7);box-shadow:0 0 18px rgba(255,255,255,.15);background:rgba(255,255,255,.07)}
.pm{display:flex;flex-direction:column;gap:8px}
.pm button{display:flex;justify-content:space-between;align-items:center;padding:16px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:15px;font-weight:700}

.total{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 14px;font-size:14px;color:var(--muted)}

.okbig{text-align:center;padding:16px 0 6px}
.okbig .c{width:84px;height:84px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--text);box-shadow:0 0 30px rgba(255,255,255,.4)}
.okbig .c svg{width:40px;height:40px}
.okbig h2{font-size:20px}.okbig p{color:var(--muted);font-size:13px;margin-top:6px}

#toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-140%);z-index:95;padding:12px 18px;border-radius:14px;background:var(--inv-bg);color:var(--inv-text);font-weight:700;font-size:13.5px;box-shadow:0 0 20px rgba(255,255,255,.3);transition:transform .3s,opacity .3s;max-width:90%;text-align:center;opacity:0}
#toast.on{transform:translate(-50%,0);opacity:1}

/* ---------- светлая тема: всё контрастное ---------- */
body.light .sw.on{background:rgba(10,12,30,.14);border-color:var(--text)}
body.light .sw.on::after{background:var(--text);box-shadow:none}
body.light .bar i{background:linear-gradient(90deg,#a3a6b0,#0a0b10);box-shadow:none}

body.light .pk button.on,body.light .pm button.on{border-color:var(--text);background:rgba(10,12,30,.05);box-shadow:none}
body.light .orb{background:radial-gradient(circle at 35% 30%,#fff,#e2e4ea);border-color:rgba(10,12,30,.14);box-shadow:0 10px 30px rgba(10,12,30,.12)}
body.light .orb svg,body.light .rbig,body.light .gcard .gi svg,body.light nav button.on svg{filter:none}
body.light .gcard .gi{background:#f3f4f7}
body.light .vb,body.light .balpill i,body.light .btn,body.light .seg button.on,body.light nav button.mid{box-shadow:0 4px 14px rgba(10,12,30,.18)}
body.light .pc .ic{filter:none}
body.light .rip{border-color:rgba(10,12,30,.35)}
body.light #sheet{border-top-color:rgba(10,12,30,.12);box-shadow:0 -10px 40px rgba(10,12,30,.12)}
body.light .pod .pa{box-shadow:0 6px 16px rgba(10,12,30,.2)}
body.light .pod .crown{color:var(--text);filter:none}
body.light .okbig .c{box-shadow:0 6px 20px rgba(10,12,30,.15)}
body.light .demo{border-color:rgba(10,12,30,.2)}
body.light .glass{border-color:rgba(10,12,30,.09)}

/* ---------- токены, Mines, Rocket, игры ---------- */
.tok{display:flex;align-items:center;gap:14px;padding:16px;margin-bottom:12px}
.tok .tv{flex:1}.tok .tv small{font-size:11px;font-weight:800;letter-spacing:1.2px;color:var(--muted);text-transform:uppercase}
.tok .tv b{display:block;font-family:Unbounded,sans-serif;font-size:24px;margin-top:2px}
.tok button{padding:10px 14px;border-radius:12px;background:var(--inv-bg);color:var(--inv-text);font-weight:800;font-size:12.5px}
.tok button:disabled{background:transparent;border:1px solid var(--line);color:var(--muted)}
.gscroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px 40px;color:#fff;touch-action:pan-y}
.gscroll .inp{background:#0d0d10;color:#fff;border-color:rgba(255,255,255,.14)}
.gscroll .lbl2{color:#9a9ca6}
.gscroll .seg{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
.gscroll .seg button{color:#9a9ca6}.gscroll .seg button.on{background:#fff;color:#050506}
.gscroll .btn{background:#fff;color:#050506}.gscroll .btn.ghost{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.15)}
.gtok{text-align:center;font-size:12px;color:#9a9ca6;margin:2px 0 8px}.gtok b{color:#fff;font-size:15px}
.mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;width:min(100%,360px);margin:6px auto 10px}
.mgrid button{aspect-ratio:1;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);display:grid;place-items:center;color:#fff;transition:transform .15s,background .2s}
.mgrid button:active{transform:scale(.93)}
.mgrid button.gem{background:rgba(255,255,255,.17);box-shadow:0 0 14px rgba(255,255,255,.35)}
.mgrid button.mine{background:rgba(255,90,110,.2);border-color:rgba(255,90,110,.55);color:#ff8a98}
.mgrid button.dim{opacity:.4}
.mgrid svg{width:52%;height:52%}
.ginfo{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:min(100%,360px);margin:0 auto 10px}
.ginfo div{background:rgba(255,255,255,.06);border-radius:12px;padding:8px 4px;text-align:center;font-size:9.5px;font-weight:700;color:#9a9ca6;text-transform:uppercase;letter-spacing:.5px}
.ginfo b{display:block;color:#fff;font-size:14px;margin-top:3px;text-transform:none;letter-spacing:0}
.bchips{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}
.bchips button{padding:9px 2px;border-radius:10px;background:rgba(255,255,255,.07);font-weight:800;font-size:12px;color:#fff}
.gres{text-align:center;padding:10px;border-radius:14px;margin:4px auto 10px;width:min(100%,360px);font-weight:800}
.gres.win{background:rgba(255,255,255,.12)}.gres.lose{background:rgba(255,90,110,.15);color:#ff9aa6}
.rules{font-size:11.5px;line-height:1.55;color:#9a9ca6;margin-top:14px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
.rules b{color:#fff}
.odds{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin-top:8px;font-size:12px}
.ghist{margin-top:14px}.ghist .r{display:flex;justify-content:space-between;font-size:12px;padding:8px 2px;border-top:1px solid rgba(255,255,255,.07);color:#9a9ca6}
.ghist .r b{color:#fff}.ghist .r .w{color:#fff}.ghist .r .l{color:#ff8a98}
.rk-wrap{position:relative;height:42vh;min-height:230px;margin:0 -16px 8px}
.rk-wrap canvas{position:absolute;inset:0}
.rk-m{position:absolute;left:0;right:0;top:34%;text-align:center;font-family:Unbounded,sans-serif;font-size:44px;font-weight:800;text-shadow:0 0 22px rgba(255,255,255,.55);pointer-events:none}
.rk-m.bad{color:#ff8a98;text-shadow:0 0 22px rgba(255,90,110,.5)}
.rk-s{position:absolute;left:0;right:0;top:calc(34% + 58px);text-align:center;font-size:12.5px;color:#9a9ca6;pointer-events:none}
/* ---------- розыгрыш ---------- */
.gwhero{padding:18px;text-align:center}
.gwhero h2{font-family:Unbounded,sans-serif;font-size:19px}
.cd{font-family:Unbounded,sans-serif;font-size:22px;margin-top:10px;letter-spacing:1px}
.cdl{font-size:11px;color:var(--muted);margin-top:2px}
.bigt{font-family:Unbounded,sans-serif;font-size:40px;font-weight:800;text-shadow:var(--glow)}
.linkbox{display:flex;align-items:center;gap:8px;padding:12px 14px;border-radius:14px;background:var(--card-s);border:1px solid var(--line);font-family:monospace;font-size:12px;word-break:break-all;margin-top:10px}
.linkbox span{flex:1}
.fst{font-size:10px;font-weight:800;padding:3px 7px;border-radius:7px;background:var(--card2);white-space:nowrap}
.fst.counted{color:var(--ok)}.fst.pending,.fst.fresh{color:var(--warn)}.fst.left,.fst.not_new,.fst.already_member{color:var(--muted)}
.adm .row{flex-wrap:wrap}
.abtn{display:flex;flex-wrap:wrap;gap:6px;width:100%;margin-top:6px}
.abtn button{padding:8px 11px;border-radius:10px;border:1px solid var(--line);font-size:12px;font-weight:700}
.abtn button.pr{background:var(--inv-bg);color:var(--inv-text);border-color:transparent}
textarea.inp{min-height:150px;resize:vertical;font-size:14px;line-height:1.45}
.flag{color:var(--warn);font-size:11px;margin-top:3px}
/* ---------- панель владельца ---------- */
.pstats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.pstats>div{padding:12px 14px;border-radius:16px}
.pstats small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.pstats b{display:block;font-family:Unbounded,sans-serif;font-size:17px;margin-top:3px}
.pstats span{font-size:11px;color:var(--muted)}
.ptabs{margin:12px 0}.ptabs button{font-size:12px;padding-left:4px;padding-right:4px}
.psearch,.prow{display:flex;gap:8px;align-items:center}
.psearch{margin-bottom:10px}.psearch .inp,.prow .inp{flex:1;min-width:0}
.psearch .btn,.prow .btn{width:auto;padding:0 16px;height:46px;flex:none}
.prow+.prow{margin-top:6px}
.prank{padding:10px 0;border-bottom:1px solid var(--line)}
.pchk{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:12.5px;color:var(--muted)}
.pnote{font-size:11.5px;color:var(--muted);margin:10px 4px;line-height:1.5}
.pbadge{font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--card2)}
.pbadge.bad{color:var(--bad)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:4px 0 6px}
.pgrid div{background:var(--card2);border-radius:12px;padding:8px 10px}
.pgrid small{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase}
.pgrid b{display:block;font-size:15px;margin-top:2px}

/* ---------- логотип и прозрачные звёзды/подарки на фоне ---------- */
#splash .robot{visibility:hidden}
#splash.nologo .robot{visibility:visible}
.splash-logo{width:132px;height:132px;border-radius:30px;filter:drop-shadow(0 0 18px rgba(255,255,255,.35));animation:float 2.4s ease-in-out infinite}
.orb.lg{background:none;border:none;box-shadow:none;width:96px;height:96px}
.orb.lg img{width:96px;height:96px;border-radius:24px;filter:drop-shadow(0 0 16px rgba(255,255,255,.3))}
.vb.lg{background:none;box-shadow:none}
.vb.lg img{width:22px;height:22px;border-radius:6px}
.vb.vf{background:none;box-shadow:none;filter:drop-shadow(0 0 6px rgba(255,255,255,.45))}
.vb.vf svg{width:22px;height:22px}
body.light .vb.vf{filter:drop-shadow(0 1px 3px rgba(10,12,30,.35))}
.sparkles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.sparkles svg{position:absolute;color:#fff;opacity:var(--o);animation:spfloat 14s ease-in-out infinite,sptw 4s ease-in-out infinite}
body.light .sparkles svg{color:#3b3e4a;opacity:calc(var(--o) * 2.2)}
@keyframes spfloat{50%{translate:0 -14px}}
@keyframes sptw{50%{scale:.72}}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:var(--ok)}
.live .dot{width:8px;height:8px}
.live b{font-family:Unbounded,sans-serif;font-size:12px;color:var(--text);font-weight:700;letter-spacing:.5px}

body.noanim *,body.noanim *::before,body.noanim *::after{animation:none!important;transition:none!important}
body.noanim #liquid{display:none}
</style>

<script>
/* =========================================================
   НАСТРОЙКИ МАГАЗИНА — меняйте только этот блок
   ========================================================= */
const CONFIG = {
  shopName: "Drip Store",
  botName: "Drip Store",
  channel: "",                     // username канала без @ (для розыгрышей, этап D)

  autoPay: false,                   // станет true на этапе E (автозачисление)                    // true = зелёная точка «зачисляется автоматически»
  // Ранги: сумма покупок (сум), с которой даётся ранг, и награда
  ranks: [

async function api(path, method="GET", body){
  const r = await fetch(CONFIG.apiUrl + path, {
    method, headers: {"Content-Type":"application/json", "X-Init-Data": tg.initData},
    body: body ? JSON.stringify(body) : undefined
  });
  let data={}; try{ data = await r.json(); }catch(e){}
  if (!r.ok){ const err=new Error(data.detail||("http_"+r.status)); err.status=r.status; throw err; }
  return data;
}
function apiErr(e){
  const map={low_balance:"low_balance",bad_username:"bad_username",price_not_set:"err_price",card_not_set:"err_card",
    too_many_requests:"err_often",too_many_open_topups:"err_open",bad_amount:"err_amount",unauthorized:"err_auth",
    shop_closed:"err_closed",already_claimed:"claimed",rank_not_reached:"err_rank",

function histTitle(h){
  if (h.kind==="stars") return `${fmt(h.qty)} ${t("stars_w")}`;
  if (h.kind==="premium") return `Premium ${h.qty} ${t("months")}`;
  if (h.kind==="reward") return `${t("reward")}: ${rewardText(CONFIG.ranks[h.rank]||{})}`;
  if (h.kind==="game") return `${h.game==="mines"?"Mines":"Rocket"} · ${h.bet} → ${h.payout}${h.payout?` (${h.multiplier}x)`:""}`;
  if (h.kind==="prize") return `${t("prize")}: ${h.place} ${t("gw_place")}${h.prize?" — "+h.prize:""}`;
  return t("topup")+" · "+(h.kind==="atm"?"BANKOMAT":"HUMO");
}

/* ===== СЛОТЫ ПОД ВАШИ КАРТИНКИ (.png, затем .webp, иначе запасная иконка) ===== */
const MISS={};
function slot(name, fb){
  if (MISS[name]===2) return `<span class="slotfb">${fb}</span>`;
  const ext = MISS[name]===1 ? "webp" : "png";
  return `<img class="slot" src="${name}.${ext}" data-n="${name}" onerror="slotErr(this)" alt=""><span class="slotfb" hidden>${fb}</span>`;
}
function slotErr(el){
  const n=el.dataset.n;
  if (el.src.endsWith(".png")) { MISS[n]=1; el.src=n+".webp"; }
  else { MISS[n]=2; if (el.nextElementSibling) el.nextElementSibling.hidden=false; el.remove(); }
}
const prodIcon = k => slot(k==="stars"?"stars":"premium", k==="stars"?I.star:I.prem);
const mini = k => `<span class="mini">${prodIcon(k)}</span>`;
function initGifts(){
  const g=document.getElementById("gifts");

    im.onerror=()=>{ if(im.src.endsWith(".png")) im.src=`gift${i}.webp`; else im.remove(); };
    g.appendChild(im);
  }
}

/* ===== ЗВУК КАПЛИ (создаётся программно, без файлов) ===== */
let actx;
function dropSound(){
  if (!S.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t0=actx.currentTime, o=actx.createOscillator(), g=actx.createGain(), f=actx.createBiquadFilter();
    o.type="sine"; o.frequency.setValueAtTime(1250,t0); o.frequency.exponentialRampToValueAtTime(380,t0+.11);
    f.type="lowpass"; f.frequency.value=2400;
    g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(.16,t0+.008); g.gain.exponentialRampToValueAtTime(.0001,t0+.19);
    o.connect(f).connect(g).connect(actx.destination); o.start(t0); o.stop(t0+.2);
  }catch(e){}
}

document.addEventListener("pointerdown", e=>{
  lastX=e.clientX; lastY=e.clientY;
  if (!e.target.closest("button,.tap,input")) return;
  if (document.getElementById("game").classList.contains("on") && !e.target.closest("button")) return;

  ["","b"].forEach(c=>{ const r=document.createElement("span"); r.className="rip "+c; r.style.left=lastX+"px"; r.style.top=lastY+"px"; box.appendChild(r); setTimeout(()=>r.remove(),900); });

/* ===== ПЛАВНЫЙ «ВОДЯНОЙ» ПЕРЕХОД ===== */
let busy=false;
function liquid(cb){
  if (S.noanim){ cb(); return; }
  if (busy){ cb(); return; }
  busy=true;
  const L=document.getElementById("liquid");
  L.style.setProperty("--x",lastX+"px"); L.style.setProperty("--y",lastY+"px");
  L.className=""; void L.offsetWidth; L.className="in";
  setTimeout(()=>{ cb(); window.scrollTo(0,0); L.className="out"; },300);
  setTimeout(()=>{ L.className=""; busy=false; },700);
}

/* Купить сразу картой: сервер создаёт заявку с заказом внутри. После перевода — заказ и звёзды автоматически. */
async function payDirect(o,full){
  const qty = o.kind==="stars" ? SO.qty : PO.m;
  const order = `${o.title} → @${o.recipient}`;
  if (LIVE){
    const btn=document.getElementById(full?"cardBtn":"balBtn"), old=btn?btn.innerHTML:"";
    if(btn){ btn.disabled=true; btn.innerHTML=`<span class="spin"></span>`; }
    try{
      const d=await api("/api/order/pay","POST",{product:o.kind,quantity:qty,recipient:o.recipient,full:!!full});
      closeSheet(); if(!full) toast(t("pay_need")); haptic("medium");
      TS={step:"pay",method:"uzcard",amount:"",id:d.id,exact:d.exact,card:{number:d.card_number,holder:d.card_holder},order};
      payLeft=d.expires_in; liquid(()=>{ view="topup"; render(); startTimer(); });
    }catch(e){
      if(btn){ btn.disabled=false; btn.innerHTML=old; }
      if (e.message==="enough_balance"){ await sync(); if (S.balance>=o.price) doBuy(o); } else apiErr(e);
    }
    return;
  }
  closeSheet(); if(!full) toast(t("pay_need")); haptic("medium");
  const need=Math.max(CONFIG.minTopup, full ? o.price : o.price-S.balance);
  TS={step:"pay",method:"uzcard",amount:"",exact:need+Math.floor(Math.random()*99)+1,order};
  payLeft=15*60; liquid(()=>{ view="topup"; render(); startTimer(); });
}
function topBack(){ if (TS.order){ clearInterval(payTimer); TS={step:"method",method:"uzcard",amount:"",exact:0}; liquid(()=>{ view="home"; render(); }); return; }
  TS.step = TS.step==="pay" ? "amount" : "method"; clearInterval(payTimer); liquid(render); }
let payTimer=null, payLeft=0;
async function toPay(){
  const a=parseInt(TS.amount)||0;
  if (a<CONFIG.minTopup){ toast(t("bad_amount")+money(CONFIG.minTopup)); return; }
  if (LIVE){
    const b=document.getElementById("amtBtn"); if(b){ b.disabled=true; b.innerHTML=`<span class="spin"></span>`; }
    try{
      const d=await api("/api/topup","POST",{method:TS.method,amount:a});
      TS.id=d.id; TS.exact=d.exact; TS.card={number:d.card_number,holder:d.card_holder};
      TS.step="pay"; payLeft=d.expires_in; liquid(()=>{ render(); startTimer(); });
    }catch(e){ apiErr(e); if(b){ b.disabled=false; b.textContent=t("continue"); } }
    return;
  }
  TS.exact = TS.method==="uzcard" ? a+Math.floor(Math.random()*99)+1 : a;
  TS.step="pay"; payLeft=15*60; liquid(()=>{ render(); startTimer(); });
}

function openServerGame(title, html){
  haptic(); curGame=title;
  const el=document.getElementById("game");
  el.innerHTML=`<div class="ghead"><button onclick="closeGame()">${I.x}</button><b>${title}</b><span class="gs" id="gscore">${G?fmt(G.tokens):""}</span></div><div class="garea"><div class="gscroll" id="gbody">${html}</div></div>`;
  el.classList.add("on"); updateBack();
  try{ if(tgv("7.7")) tg.disableVerticalSwipes(); }catch(e){}
}
function setTokens(n){ if(G) G.tokens=n; const el=document.getElementById("gscore"); if(el) el.textContent=fmt(n); }
function betBox(id, val){
  return `<div class="lbl2">${t("bet")} (${t("tokens").toLowerCase()}: <b id="tkInline" style="color:#fff">${fmt(G.tokens)}</b>)</div>
  <input class="inp" id="${id}" type="number" inputmode="numeric" min="${G.min_bet}" value="${val}">
  <div class="bchips">${[2,5,10,25].map(v=>`<button onclick="setBet('${id}',${v})">${v}</button>`).join("")}
    <button onclick="setBet('${id}','half')">½</button><button onclick="setBet('${id}','x2')">×2</button></div>`;
}
function setBet(id,v){ const el=document.getElementById(id); let n=parseInt(el.value)||G.min_bet;
  if(v==="half") n=Math.max(G.min_bet,Math.floor(n/2)); else if(v==="x2") n=Math.min(G.tokens,n*2); else n=v;
  el.value=Math.max(G.min_bet,Math.min(n,G.max_bet)); haptic(); }
function readBet(id){
  const n=parseInt(document.getElementById(id).value);
  if(!Number.isInteger(n) || n<G.min_bet){ toast(t("bad_bet")); return 0; }
  if(n>G.tokens){ toast(t("low_tokens")); return 0; }
  return n;
}
function histBox(game){
  const h=(G.history||[]).filter(x=>x.game===game).slice(0,10);
  return `<div class="ghist"><div class="lbl2">${t("history_g")}</div>${h.length?h.map(x=>{const d=new Date(x.date);
    return `<div class="r"><span>${d.toLocaleDateString("ru-RU")} ${d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})} · ${t("bet")} ${x.bet}${x.mines?" · "+x.mines+" "+t("mines_n").toLowerCase():""}</span>
    <b class="${x.status==="won"?"w":"l"}">${x.status==="won"?"+"+fmt(x.payout)+" ("+x.multiplier+"x)":(game==="rocket"&&x.crash?"💥 "+x.crash+"x":"−"+x.bet)}</b></div>`;}).join(""):`<div class="r">${t("no_games")}</div>`}</div>`;
}

let MS={mines:3, bet:5, round:null, busy:false};
function openMines(){
  if(!G){ loadGames(); return; }
  MS.round = G.active.mines || null;
  openServerGame("Mines", minesHTML());
}
function minesHTML(){
  const r=MS.round, act=r&&r.status==="active", fin=r&&r.status!=="active";
  const opened=r?r.opened:[], mineCells=(r&&r.mine_cells)||[];
  const cells=Array.from({length:25},(_,i)=>{
    const o=opened.includes(i), m=mineCells.includes(i);
    let cls="", ic="";
    if(o && !m){ cls="gem"; ic=I.gem; } else if(m){ cls="mine"+(o?"":" dim"); ic=I.mine; } else if(fin){ cls="dim"; }
    return `<button class="${cls}" ${act&&!o?`onclick="minesOpen(${i})"`:"disabled"}>${ic}</button>`;
  }).join("");
  const tb=G.mines.tables[String(r?r.mines:MS.mines)];
  const info = r ? `<div class="ginfo"><div>${t("bet")}<b>${r.bet}</b></div><div>${t("mines_n")}<b>${r.mines}</b></div>
      <div>${t("opened")}<b>${opened.filter(i=>!mineCells.includes(i)).length}</b></div><div>${t("coef")}<b>${r.multiplier}x</b></div></div>` : "";
  let res="";
  if(fin) res = r.status==="won" ? `<div class="gres win">${t("win")}: +${fmt(r.payout)} (${r.multiplier}x)</div>` : `<div class="gres lose">${t("lose")}</div>`;
  const ctl = act
    ? `<button class="btn" id="mCash" ${r.opened.length?"":"disabled"} onclick="minesCash()">${t("cashout")} ${fmt(Math.floor(r.bet*r.multiplier))}</button>
       ${r.next?`<p style="text-align:center;font-size:12px;color:#9a9ca6;margin-top:8px">${t("next_coef")}: ${r.next}x → ${fmt(Math.floor(r.bet*r.next))}</p>`:""}`
    : `${betBox("mBet",MS.bet)}
       <div class="lbl2">${t("mines_n")}</div>
       <div class="seg">${G.mines.options.map(m=>`<button class="${MS.mines===m?"on":""}" onclick="MS.mines=${m};MS.round=null;rerenderMines()">${m}</button>`).join("")}</div>
       <p style="font-size:11.5px;color:#9a9ca6;margin:8px 2px 0">${t("coef")}: ${tb.slice(0,6).map((x,i)=>`${i+1}→${x}x`).join(" · ")}</p>
       <button class="btn" style="margin-top:14px" id="mStart" onclick="minesStart()">${t("start_game")}</button>`;
  return `${res}<div class="mgrid">${cells}</div>${info}${ctl}
    <div class="rules"><b>${t("rules")}.</b> ${t("mines_rules")}<br>${t("fun_only")}</div>${histBox("mines")}`;
}
function rerenderMines(){ const b=document.getElementById("gbody"); if(b) b.innerHTML=minesHTML(); }
async function minesStart(){
  if(MS.busy) return; const bet=readBet("mBet"); if(!bet) return;
  MS.bet=bet; MS.busy=true; const b=document.getElementById("mStart"); if(b){ b.disabled=true; b.innerHTML=`<span class="spin"></span>`; }
  try{ const d=await api("/api/mines/start","POST",{bet, mines:MS.mines, nonce:nonce()}); MS.round=d.round; setTokens(d.tokens); haptic(); }
  catch(e){ apiErr(e); if(e.message==="round_active"){ await loadGames(true); if(G) MS.round=G.active.mines; } }
  MS.busy=false; rerenderMines();
}
async function minesOpen(i){
  if(MS.busy||!MS.round) return; MS.busy=true;
  try{ const d=await api(`/api/mines/${MS.round.id}/open`,"POST",{cell:i}); MS.round=d.round; setTokens(d.tokens);
    if(d.round.status==="lost"){ notify("error"); haptic("heavy"); finishedRound(); } else if(d.round.status==="won"){ notify(); finishedRound(); } else haptic(); }
  catch(e){ apiErr(e); }
  MS.busy=false; rerenderMines();
}
async function minesCash(){
  if(MS.busy||!MS.round) return; MS.busy=true;
  try{ const d=await api(`/api/mines/${MS.round.id}/cashout`,"POST"); MS.round=d.round; setTokens(d.tokens); notify(); finishedRound(); }
  catch(e){ apiErr(e); }
  MS.busy=false; rerenderMines();
}

/* ---------- ROCKET ---------- */
let RS={bet:5, round:null, base:0, recv:0, poll:null, raf:null, busy:false, path:[]};
function openRocket(){
  if(!G){ loadGames(); return; }
  RS.round = G.active.rocket || null;
  openServerGame("Rocket", rocketHTML());
  stopGame=()=>{ clearInterval(RS.poll); cancelAnimationFrame(RS.raf); };
  if(RS.round && RS.round.status==="active") rocketFly(RS.round); else drawRocket(1,false);
}
function rocketHTML(){
  return `<div class="rk-wrap"><canvas id="rkc"></canvas><div class="rk-m" id="rkm">1.00x</div><div class="rk-s" id="rks"></div></div>
  <div id="rkctl">${rocketCtl()}</div>
  <div class="rules"><b>${t("rules")}.</b> ${t("rocket_rules")}
    <div style="margin-top:8px"><b>${t("odds")}:</b></div>
    <div class="odds">${G.rocket.odds.map(o=>`<span>${o.x}</span><b>${(o.p*100).toFixed(o.p<0.01?2:1)}%</b>`).join("")}</div>
    <div style="margin-top:8px">${t("fun_only")}</div></div>
  <div id="rkh">${histBox("rocket")}</div>`;
}
function rocketCtl(){
  const r=RS.round;
  if(r && r.status==="active") return `<button class="btn" id="rkCash" onclick="rocketCash()">${t("cashout")}</button>`;
  return `${betBox("rBet",RS.bet)}<button class="btn" style="margin-top:14px" id="rkStart" onclick="rocketStart()">${t("launch")}</button>`;
}
function rkMult(){ const el=RS.base+(performance.now()-RS.recv)/1000; return Math.floor(Math.exp(G.rocket.speed*el)*100)/100; }
async function rocketStart(){
  if(RS.busy) return; const bet=readBet("rBet"); if(!bet) return;
  RS.bet=bet; RS.busy=true; const b=document.getElementById("rkStart"); if(b){ b.disabled=true; b.innerHTML=`<span class="spin"></span>`; }
  try{ const d=await api("/api/rocket/start","POST",{bet, nonce:nonce()}); setTokens(d.tokens); haptic("medium"); rocketFly(d.round); }
  catch(e){ apiErr(e); const c=document.getElementById("rkctl"); if(c) c.innerHTML=rocketCtl(); }
  RS.busy=false;
}
function rocketFly(r){
  RS.round=r; RS.base=r.elapsed; RS.recv=performance.now(); RS.path=[];
  const c=document.getElementById("rkctl"); if(c) c.innerHTML=rocketCtl();
  document.getElementById("rkm").className="rk-m"; document.getElementById("rks").textContent=t("flying");
  clearInterval(RS.poll);
  RS.poll=setInterval(async()=>{                       // сервер сообщает, взорвалась ли ракета
    if(!RS.round||RS.round.status!=="active"){ clearInterval(RS.poll); return; }
    try{ const d=await api(`/api/rocket/${RS.round.id}`); if(d.round.status!=="active") rocketEnd(d.round, d.tokens);
      else { RS.base=d.round.elapsed; RS.recv=performance.now(); } }catch(e){}
  },700);
  const loop=()=>{ if(!RS.round||RS.round.status!=="active") return;
    const m=rkMult(); const el=document.getElementById("rkm"); if(!el) return;
    el.textContent=m.toFixed(2)+"x"; const cb=document.getElementById("rkCash"); if(cb) cb.textContent=`${t("cashout")} ${fmt(Math.floor(RS.round.bet*m))}`;
    drawRocket(m,true); RS.raf=requestAnimationFrame(loop); };
  loop();
}
async function rocketCash(){
  if(RS.busy||!RS.round) return; RS.busy=true; const b=document.getElementById("rkCash"); if(b) b.disabled=true;
  try{ const d=await api(`/api/rocket/${RS.round.id}/cashout`,"POST"); rocketEnd(d.round, d.tokens); }
  catch(e){ apiErr(e); if(b) b.disabled=false; }
  RS.busy=false;
}
function rocketEnd(r, tokens){
  clearInterval(RS.poll); cancelAnimationFrame(RS.raf); RS.round=r; setTokens(tokens);
  const m=document.getElementById("rkm"), st=document.getElementById("rks"); if(!m) return;
  if(r.status==="won"){ m.className="rk-m"; m.textContent=r.multiplier.toFixed(2)+"x"; st.textContent=`${t("cashed")} ${r.multiplier}x · +${fmt(r.payout)}`; notify(); drawRocket(r.multiplier,false); }
  else { m.className="rk-m bad"; m.textContent=(r.crash||1).toFixed(2)+"x"; st.textContent=`${t("crashed")} ${r.crash}x`; notify("error"); haptic("heavy"); drawRocket(r.crash||1,false,true); }
  RS.round=null; const c=document.getElementById("rkctl"); if(c) c.innerHTML=rocketCtl();
  api("/api/games").then(d=>{ G=d; const h=document.getElementById("rkh"); if(h) h.innerHTML=histBox("rocket"); }).catch(()=>{});
}
function drawRocket(m, flying, boom){
  const c=document.getElementById("rkc"); if(!c) return;
  const W=c.parentElement.clientWidth, H=c.parentElement.clientHeight, dpr=Math.min(window.devicePixelRatio||1,2);
  if(c.width!==W*dpr){ c.width=W*dpr; c.height=H*dpr; c.style.width=W+"px"; c.style.height=H+"px"; }
  const x=c.getContext("2d"); x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,W,H);
  const tNow=Math.log(Math.max(1,m))/G.rocket.speed, tMax=Math.max(10,tNow*1.15), mMax=Math.max(2,m*1.15);
  const px=tt=>20+(W-50)*tt/tMax, py=mm=>H-24-(H-60)*(mm-1)/(mMax-1);
  x.strokeStyle="rgba(255,255,255,.07)"; x.lineWidth=1;
  for(let i=1;i<5;i++){ const yy=H-24-(H-60)*i/4; x.beginPath(); x.moveTo(20,yy); x.lineTo(W-20,yy); x.stroke(); }
  x.beginPath(); for(let i=0;i<=60;i++){ const tt=tNow*i/60; const mm=Math.exp(G.rocket.speed*tt); i?x.lineTo(px(tt),py(mm)):x.moveTo(px(tt),py(mm)); }
  x.strokeStyle=boom?"#ff8a98":"#fff"; x.lineWidth=3; x.shadowColor=boom?"#ff5a6e":"#fff"; x.shadowBlur=14; x.stroke(); x.shadowBlur=0;
  const ex=px(tNow), ey=py(m);
  x.save(); x.translate(ex,ey); x.rotate(-0.6);
  if(boom){ for(let i=0;i<14;i++){ const a=i/14*6.283; x.strokeStyle="rgba(255,138,152,.8)"; x.beginPath(); x.moveTo(Math.cos(a)*6,Math.sin(a)*6); x.lineTo(Math.cos(a)*18,Math.sin(a)*18); x.stroke(); } }
  else { x.fillStyle="#fff"; x.beginPath(); x.moveTo(16,0); x.lineTo(-8,-7); x.lineTo(-4,0); x.lineTo(-8,7); x.closePath(); x.fill();
    if(flying){ x.fillStyle="rgba(255,255,255,"+(.3+Math.random()*.4)+")"; x.beginPath(); x.moveTo(-6,-3); x.lineTo(-16-Math.random()*8,0); x.lineTo(-6,3); x.fill(); } }
  x.restore();
}

  openSheet(`<div class="sh-title"><div class="ic ri">${I.gift}</div><div><h2>${g?"Розыгрыш #"+g.id:"Новый розыгрыш"}</h2><p>${g?GST[g.status]:"черновик"}</p></div></div>

async function gaDraft(){

async function gaSave(){
  const v=id=>document.getElementById(id).value;
  const end=v("gaE")?new Date(v("gaE")).getTime():null;
  const body={id:GF.id, title:v("gaT").trim(), prizes:v("gaP").split("\n").map(x=>x.trim()).filter(Boolean), end_at:end,
    button_text:v("gaB").trim()||"Участвовать", post_text:v("gaX"), draft_id:GF.draft_id, remove_photo:!!(document.getElementById("gaRP")||{}).checked};
  if(!body.title){ toast("Укажите название"); return; }
  const b=document.getElementById("gaSave"); b.disabled=true;
  try{ const d=await api("/api/admin/gw","POST",body); toast(d.warning||"Сохранено"); closeSheet(); await loadGa(); }
  catch(e){ toast({text_too_long:"Текст слишком длинный (с фото — до 1024 символов)",bad_end:"Дата итогов должна быть в будущем",not_editable:"Этот розыгрыш уже нельзя изменить"}[e.message]||t("err_generic")); b.disabled=false; }

/* --- Заявки: пополнения, заказы, награды --- */
function pPend(){
  if(!PP) return `<div class="empty"><span class="spin"></span></div>`;
  if(!PP.length) return `<div class="empty">${I.check}<b>Всё обработано</b>Новых заявок нет</div>`;
  return `<div class="glass card adm">${PP.map(x=>{
    const title = x.kind==="tp" ? `Пополнение #${x.id}: +${fmt(x.amount)} сум (${x.method==="uzcard"?"карта":"банкомат"})`
      : x.kind==="or" ? `Заказ #${x.id}: ${x.product==="stars"?fmt(x.qty)+" Stars":"Premium "+x.qty+" мес."} → @${esc(x.recipient)} · ${fmt(x.amount)} сум`
      : `Награда за ранг: ${esc(x.reward||"")}`;
    return `<div class="row"><div class="ri">${x.kind==="tp"?I.wallet:x.kind==="or"?I.box:I.gift}</div><div class="rt"><b>${title}</b><span>${pWho(x.user)} · ${pDate(x.date)}</span></div>
      <div class="abtn"><button class="pr" onclick="pDecideAsk('${x.kind}',${x.id},true)">${x.kind==="tp"?"Зачислить":x.kind==="or"?"Выполнено":"Выдано"}</button>
      <button onclick="pDecideAsk('${x.kind}',${x.id},false)">Отклонить</button></div></div>`; }).join("")}</div>
  <p class="pnote">Пополнение: «Зачислить» — только если деньги реально пришли на карту. Заказ: «Выполнено» — после отправки Stars/Premium. «Отклонить» заказ — деньги вернутся клиенту.</p>`;
}
function pDecideAsk(kind,id,ok){
  pConfirm(ok?"Подтвердить заявку?":"Отклонить заявку?", `pDecide('${kind}',${id},${ok})`);
}
async function pDecide(kind,id,ok){
  try{ await api(`/api/panel/decide/${kind}/${id}`,"POST",{ok}); notify(); toast(ok?"Готово":"Отклонено"); }
  catch(e){ pErr(e); }
  loadPend(); api("/api/panel").then(d=>{PN=d; render();}).catch(()=>{});
}
function pConfirm(q,action){
  openSheet(`<div class="sh-title"><div class="ic ri">${I.alert}</div><div><h2>Подтверждение</h2><p>${q}</p></div></div>
    <button class="btn" onclick="closeSheet();${action}">Да</button><button class="btn ghost" style="margin-top:8px" onclick="closeSheet()">Нет</button>`);
}

function go(v){
  if (view===v && !(v==="topup" && TS.step!=="method")) return;

  liquid(()=>{ view=v; render(); onEnter(v); });
}

/* ----- Покупка ----- */
async function doBuy(o,mode){
  if (LIVE && !CONFIG.pricesReady){ toast(t("err_price")); return; }
  if (mode==="card"){ await payDirect(o,true); return; }          // вся цена картой, баланс не нужен
  if (S.balance < o.price){ await payDirect(o,false); return; }   // не хватает — доплата картой
  if (LIVE){
    const btn=document.getElementById("balBtn"), old=btn?btn.innerHTML:"";
    if(btn){ btn.disabled=true; btn.innerHTML=`<span class="spin"></span>`; }
    try{
      const qty = o.kind==="stars" ? SO.qty : PO.m;
      await api("/api/order","POST",{product:o.kind,quantity:qty,recipient:o.recipient});
      notify(); await sync();
      openSheet(`<div class="okbig"><div class="c">${I.check}</div><h2>${t("order_ok")}</h2><p>${o.title} → @${o.recipient}<br>${t("order_hint")}</p></div>
        <button class="btn" style="margin-top:18px" onclick="closeSheet();go('history')">${t("orders")}</button>`);
    }catch(e){
      if(btn){ btn.disabled=false; btn.innerHTML=old; }
      if (e.message==="low_balance"){ await sync(); toast(t("low_balance")); }
      else apiErr(e);
    }
    return;
  }
  const before=rankIdx(S.spent);
  S.balance-=o.price; S.spent+=o.price;
  const item={...o,id:Date.now(),date:Date.now(),status:"processing"};
  S.history.push(item); save(); render(); notify();
  openSheet(`<div class="okbig"><div class="c">${I.check}</div><h2>${t("order_ok")}</h2><p>${o.title} → @${o.recipient}<br>${t("order_hint")}</p></div>
    <button class="btn" style="margin-top:18px" onclick="closeSheet();go('history')">${t("orders")}</button>`);
  const after=rankIdx(S.spent);
  if (after>before) setTimeout(()=>toast(t("new_rank")+rName(after)),1200);
  if (CONFIG.demo) setTimeout(()=>{ const h=S.history.find(x=>x.id===item.id); if(h) h.status="done"; save(); if(view==="history") render(); },4000);
}

let stopGame=null, curGame=null;
function openGame(id){
  haptic(); curGame=id;
  const g=GAMES.find(x=>x.id===id), el=document.getElementById("game");
  el.innerHTML=`<div class="ghead"><button onclick="closeGame()">${I.x}</button><b>${t(g.n)}</b><span class="gs" id="gscore">0</span></div><div class="garea" id="garea"></div>`;
  el.classList.add("on"); updateBack();
  try{ if(tgv("7.7")) tg.disableVerticalSwipes(); }catch(e){}
  const area=document.getElementById("garea");
  const ui={ score:n=>{ const s=document.getElementById("gscore"); if(s) s.textContent=n; }, over:n=>gameOver(id,n) };
  setTimeout(()=>{ stopGame = ({skydash:gSkyDash,g2048:g2048})[id](area,ui); },60);
}
function closeGame(){
  if (stopGame) stopGame(); stopGame=null;
  document.getElementById("game").classList.remove("on"); updateBack();
  try{ if(tgv("7.7")) tg.enableVerticalSwipes(); }catch(e){}
  if (view==="games") render();
}
function gameOver(id,n){
  notify("error");
  if (n>(S.best[id]||0)){ S.best[id]=n; save(); }
  const area=document.getElementById("garea"); if(!area) return;
  const d=document.createElement("div"); d.className="gover";
  d.innerHTML=`<h3>${t("game_over")}</h3><div class="sc">${fmt(n)}</div><p>${t("best")}: ${fmt(S.best[id]||0)}</p>
    <button class="btn" onclick="openGame('${id}')">${t("again")}</button><button class="btn ghost" onclick="closeGame()">${t("close")}</button>`;
  area.appendChild(d);
}
function makeCanvas(area){
  const c=document.createElement("canvas"), x=c.getContext("2d"), dpr=Math.min(window.devicePixelRatio||1,2);
  const W=area.clientWidth, H=area.clientHeight;
  c.width=W*dpr; c.height=H*dpr; c.style.width=W+"px"; c.style.height=H+"px"; x.setTransform(dpr,0,0,dpr,0,0);
  area.appendChild(c);
  const hint=document.createElement("div"); hint.className="ghint"; hint.textContent=t("hint_move"); area.appendChild(hint);
  return {c,x,W,H,hint};
}
function pointerX(c,cb){
  const f=e=>{ const r=c.getBoundingClientRect(); const p=e.touches?e.touches[0]:e; cb(p.clientX-r.left,p.clientY-r.top); };
  c.addEventListener("pointermove",f); c.addEventListener("pointerdown",f);
  c.addEventListener("touchmove",e=>{f(e);e.preventDefault();},{passive:false});
}
function bgStars(W,H){ return Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.6+.3,v:Math.random()*1.2+.3})); }
function drawBg(x,W,H,st){
  x.fillStyle="#030304"; x.fillRect(0,0,W,H);
  st.forEach(s=>{ s.y+=s.v; if(s.y>H){s.y=0;s.x=Math.random()*W;} x.globalAlpha=s.s/2; x.fillStyle="#fff"; x.fillRect(s.x,s.y,s.s,s.s); }); x.globalAlpha=1;
}
function burst(parts,px,py,n=12){ for(let i=0;i<n;i++){ const a=Math.random()*6.28,v=Math.random()*4+1; parts.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:30}); } }
function drawParts(x,parts){ for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.x+=p.vx; p.y+=p.vy; p.l--; x.globalAlpha=p.l/30; x.fillStyle="#fff"; x.fillRect(p.x,p.y,2,2); if(p.l<=0) parts.splice(i,1); } x.globalAlpha=1; }

/* --- Игра: Sky Dash (бесплатная). Нажатие — ракета подлетает вверх, иначе падает. --- */
function gSkyDash(area,ui){
  const {c,x,W,H,hint}=makeCanvas(area); hint.textContent=t("hint_sd");
  const st=bgStars(W,H), R=13;
  const P={x:Math.max(70,W*.26),y:H*.45,vy:0};
  let obs=[], bonus=null, parts=[], started=false, alive=true, deathT=0, raf, last=performance.now();
  let time=0, score=0, toNext=0, shield=0, nextShield=25+Math.random()*10, banner="", bannerT=0, flame=0;
  const flap=()=>{ if(!alive) return; started=true; P.vy=-7.2; flame=8; haptic(); hint.style.opacity=0; };
  c.addEventListener("pointerdown",flap);
  const key=e=>{ if(e.code==="Space"||e.key==="ArrowUp"){ e.preventDefault(); flap(); } }; document.addEventListener("keydown",key);
  // Сложность растёт: за ~2.5 минуты от лёгкой до тяжёлой, дальше продолжает ускоряться
  const level=()=>Math.min(1,time/150);
  const speed=()=>3.1+level()*4.4+Math.max(0,time-150)*0.012;
  const gapH=()=>Math.max(122,205-level()*75);
  function spawn(){
    const L=level(), r=Math.random(), g=gapH(), m=50;
    const cy=m+g/2+Math.random()*Math.max(1,H-2*m-g);
    let type="pipe";                                   // колонны сверху и снизу с проходом
    if(L>0.12 && r<0.2+L*0.25) type="move";            // проход ездит вверх-вниз
    else if(L>0.3 && r<0.62) type="rock";              // астероиды
    else if(L>0.5 && r<0.75) type="narrow";            // узкий длинный проход
    if(type==="rock"){
      const n=L>0.65?2:1;
      for(let i=0;i<n;i++) obs.push({type,x:W+30+i*110,y:40+Math.random()*(H-80),r:15+Math.random()*13,vy:(Math.random()-.5)*(1+L*1.5),passed:false});
    } else obs.push({type,x:W+30,w:type==="narrow"?120:54,cy,g:type==="narrow"?Math.max(130,g+10):g,amp:type==="move"?24+L*46:0,ph:Math.random()*6.28,passed:false});
    if(type==="pipe" && !bonus && time>=nextShield){ bonus={x:W+30+27,y:cy}; nextShield=time+55+Math.random()*15; }
    toNext=Math.max(185,300-L*105)*(type==="narrow"?1.25:1);
  }
  const gapY=o=>o.cy+Math.sin(time*1.7+o.ph)*o.amp;
  function die(){
    if(shield>0) return false;
    alive=false; deathT=45; haptic("heavy"); burst(parts,P.x,P.y,28); return true;
  }
  function drawRocket(){
    x.save(); x.translate(P.x,P.y); x.rotate(Math.max(-.5,Math.min(.9,P.vy*.07)));
    if(flame>0||!started){ x.fillStyle="rgba(255,255,255,"+(.35+Math.random()*.4)+")"; x.beginPath(); x.moveTo(-14,-4); x.lineTo(-24-Math.random()*8,0); x.lineTo(-14,4); x.fill(); }
    x.shadowColor="#fff"; x.shadowBlur=12;
    const gr=x.createLinearGradient(0,-8,0,8); gr.addColorStop(0,"#ffffff"); gr.addColorStop(1,"#8d919c");
    x.fillStyle=gr; x.beginPath(); x.moveTo(18,0); x.quadraticCurveTo(8,-9,-12,-7); x.lineTo(-12,7); x.quadraticCurveTo(8,9,18,0); x.fill();
    x.fillStyle="#c9ccd4"; x.beginPath(); x.moveTo(-8,-7); x.lineTo(-16,-13); x.lineTo(-13,-6); x.fill(); x.beginPath(); x.moveTo(-8,7); x.lineTo(-16,13); x.lineTo(-13,6); x.fill();
    x.shadowBlur=0; x.fillStyle="#050506"; x.beginPath(); x.arc(5,0,3,0,6.283); x.fill();
    x.restore();
    if(shield>0){ x.strokeStyle="rgba(255,255,255,"+(shield<2?(.3+.3*Math.sin(time*25)):.65)+")"; x.lineWidth=2; x.beginPath(); x.arc(P.x,P.y,R+11,0,6.283); x.stroke(); }
  }
  function drawCol(xx,y,w,h){ x.fillStyle="rgba(255,255,255,.09)"; x.strokeStyle="#e8e9ee"; x.lineWidth=2; x.fillRect(xx,y,w,h); x.strokeRect(xx,y,w,h); }
  function loop(now){
    const dt=Math.min(2.5,(now-last)/16.67||1); last=now;
    drawBg(x,W,H,st);
    if(started && alive){
      time+=dt/60; if(shield>0) shield=Math.max(0,shield-dt/60); if(flame>0) flame-=dt;
      P.vy=Math.min(11,P.vy+0.42*dt); P.y+=P.vy*dt;
      const sp=speed()*dt; toNext-=sp; if(toNext<=0) spawn();
      if(P.y<R){ P.y=R; P.vy=Math.max(0,P.vy); if(!shield) die(); }
      if(P.y>H-R){ P.y=H-R; P.vy=0; if(!shield) die(); }
      for(let i=obs.length-1;i>=0;i--){
        const o=obs[i]; o.x-=sp;
        if(o.type==="rock"){
          o.y+=o.vy*dt; if(o.y<o.r||o.y>H-o.r) o.vy*=-1;
          if(alive && Math.hypot(o.x-P.x,o.y-P.y)<o.r+R-4){ if(!die()){ burst(parts,o.x,o.y,14); obs.splice(i,1); continue; } }
          if(!o.passed && o.x+o.r<P.x){ o.passed=true; score++; }
          if(o.x<-60) obs.splice(i,1);
        } else {
          const gy=gapY(o), top=gy-o.g/2, bot=gy+o.g/2;
          if(alive && P.x+R>o.x && P.x-R<o.x+o.w && (P.y-R+3<top || P.y+R-3>bot)) die();
          if(!o.passed && o.x+o.w<P.x){ o.passed=true; score++; }
          if(o.x+o.w<-20) obs.splice(i,1);
        }
      }
      if(bonus){ bonus.x-=sp; if(Math.hypot(bonus.x-P.x,bonus.y-P.y)<R+16){ shield=10; banner=t("b_shield")+" 10s"; bannerT=90; notify(); burst(parts,bonus.x,bonus.y,16); bonus=null; } else if(bonus.x<-30) bonus=null; }
    } else if(!started){ P.y=H*.45+Math.sin(now/300)*6; }
    // рисуем препятствия
    x.shadowColor="#fff"; x.shadowBlur=6;
    obs.forEach(o=>{
      if(o.type==="rock"){ x.fillStyle="rgba(255,255,255,.1)"; x.strokeStyle="#e8e9ee"; x.lineWidth=2; x.beginPath(); x.arc(o.x,o.y,o.r,0,6.283); x.fill(); x.stroke();
        x.beginPath(); x.arc(o.x-o.r*.3,o.y-o.r*.2,o.r*.22,0,6.283); x.stroke(); }
      else { const gy=gapY(o); drawCol(o.x,-4,o.w,gy-o.g/2+4); drawCol(o.x,gy+o.g/2,o.w,H-(gy+o.g/2)+4); }
    });
    x.shadowBlur=0;
    if(bonus){ x.save(); x.translate(bonus.x,bonus.y+Math.sin(now/200)*4); x.shadowColor="#fff"; x.shadowBlur=18; x.strokeStyle="#fff"; x.lineWidth=2.4;
      x.beginPath(); x.arc(0,0,14,0,6.283); x.stroke(); x.beginPath(); x.moveTo(0,-8); x.lineTo(7,-4); x.lineTo(6,4); x.lineTo(0,9); x.lineTo(-6,4); x.lineTo(-7,-4); x.closePath(); x.stroke(); x.restore(); }
    if(alive) drawRocket();
    drawParts(x,parts);
    if(shield>0){ x.fillStyle="rgba(255,255,255,.75)"; x.font="700 12px Manrope,sans-serif"; x.textAlign="right"; x.fillText(t("b_shield")+" "+Math.ceil(shield)+"s",W-14,24); }
    if(bannerT>0){ bannerT-=dt; x.globalAlpha=Math.min(1,bannerT/30); x.fillStyle="#fff"; x.font="800 20px Unbounded,sans-serif"; x.textAlign="center"; x.fillText(banner,W/2,H*.3); x.globalAlpha=1; }
    ui.score(score);
    if(!alive){ deathT-=dt; if(deathT<=0){ ui.over(score); return; } }
    raf=requestAnimationFrame(loop);
  }
  raf=requestAnimationFrame(loop);
  return ()=>{ alive=false; deathT=-1; cancelAnimationFrame(raf); document.removeEventListener("keydown",key); };
}

/* --- Игра 3: 2048 --- */
function g2048(area,ui){
  let b=Array(16).fill(0), score=0, alive=true;
  const box=document.createElement("div"); box.className="g2048"; area.appendChild(box);
  const hint=document.createElement("div"); hint.className="ghint"; hint.textContent=t("hint_swipe"); area.appendChild(hint);
  function add(){ const e=b.map((v,i)=>v?-1:i).filter(i=>i>=0); if(!e.length) return; b[e[Math.floor(Math.random()*e.length)]]=Math.random()<.9?2:4; }
  function color(v){ if(!v) return ["rgba(255,255,255,.04)","#fff"]; const l=Math.log2(v); const c=Math.min(255,25+l*21); return [`rgb(${c},${c},${c+4})`, l>=6?"#050506":"#fff"]; }
  function draw(pop=-1){
    box.innerHTML=b.map((v,i)=>{ const [bg,fg]=color(v), fs=v>=1024?16:v>=128?20:24;
      return `<div class="${i===pop?"pop":""}" style="background:${bg};color:${fg};font-size:${fs}px;${v>=256?"box-shadow:0 0 18px rgba(255,255,255,.35)":""}">${v||""}</div>`; }).join("");
  }
  function line(a){ let r=a.filter(v=>v), gain=0; for(let i=0;i<r.length-1;i++){ if(r[i]===r[i+1]){ r[i]*=2; gain+=r[i]; r.splice(i+1,1);} } while(r.length<4) r.push(0); return [r,gain]; }
  function move(d){
    if(!alive) return; let moved=false;
    for(let k=0;k<4;k++){
      let idx=[0,1,2,3].map(j=> d==="L"?k*4+j : d==="R"?k*4+3-j : d==="U"?j*4+k : (3-j)*4+k);
      const [r,g]=line(idx.map(i=>b[i])); score+=g;
      idx.forEach((i,j)=>{ if(b[i]!==r[j]) moved=true; b[i]=r[j]; });
    }
    if(moved){ add(); draw(); ui.score(score); haptic(); hint.style.opacity=0; }
    if(!canMove()){ alive=false; setTimeout(()=>ui.over(score),400); }
  }
  function canMove(){ if(b.includes(0)) return true; for(let i=0;i<16;i++){ if(i%4<3&&b[i]===b[i+1]) return true; if(i<12&&b[i]===b[i+4]) return true; } return false; }
  let sx=0,sy=0;
  const down=e=>{ sx=e.clientX; sy=e.clientY; };
  const up=e=>{ const dx=e.clientX-sx, dy=e.clientY-sy; if(Math.max(Math.abs(dx),Math.abs(dy))<28) return; move(Math.abs(dx)>Math.abs(dy)?(dx>0?"R":"L"):(dy>0?"D":"U")); };
  const key=e=>{ const m={ArrowLeft:"L",ArrowRight:"R",ArrowUp:"U",ArrowDown:"D"}[e.key]; if(m){ e.preventDefault(); move(m);} };
  area.addEventListener("pointerdown",down); area.addEventListener("pointerup",up); document.addEventListener("keydown",key);
  add(); add(); draw();
  return ()=>{ alive=false; document.removeEventListener("keydown",key); };
}

let LOGO=false;
(function(){
  const im=new Image(); im.alt=""; im.className="splash-logo";
  im.onload=()=>{ LOGO=true; const r=document.querySelector("#splash .robot"); if(r) r.replaceWith(im); if(view==="home") render(); };
  im.onerror=()=>document.getElementById("splash").classList.add("nologo");   // нет файла — показываем робота
  im.src=LOGO_SRC;
})();
/* ===== ПРОЗРАЧНЫЕ ЗВЁЗДЫ И ПОДАРКИ НА ФОНЕ (рисуются кодом, файлы не нужны) ===== */
(function(){
  const icons=[
    '<path d="M12 2l2.6 6.9L22 12l-7.4 3.1L12 22l-2.6-6.9L2 12l7.4-3.1z" fill="currentColor"/>',
    '<path d="M12 3l2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 16.9l-5.4 2.9 1.1-6.1-4.5-4.3 6.1-.8z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>',
    '<g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><rect x="3" y="9" width="18" height="12" rx="2"/><path d="M12 9v12M3 13h18M12 9S10 4 7.5 5.5 9 9 12 9zm0 0s2-5 4.5-3.5S15 9 12 9z"/></g>',
    '<path d="M12 4l5 8-5 8-5-8z" fill="currentColor"/>',
    '<circle cx="12" cy="12" r="4" fill="currentColor"/>'
  ];
  const box=document.createElement("div"); box.className="sparkles";
  const kinds=[0,0,1,1,2,2,3,4];        // звёзд и подарков больше, блёсток меньше
  for(let i=0;i<36;i++){
    const k=kinds[i%kinds.length], s=document.createElementNS("http://www.w3.org/2000/svg","svg"), sz=(k>=3?6:12)+Math.random()*(k>=3?8:22);
    s.setAttribute("viewBox","0 0 24 24"); s.innerHTML=icons[k];
    s.style.cssText=`left:${Math.random()*96}%;top:${Math.random()*96}%;width:${sz}px;height:${sz}px;--o:${(.06+Math.random()*.1).toFixed(2)};rotate:${Math.round(Math.random()*40-20)}deg;animation-delay:${(-Math.random()*14).toFixed(1)}s,${(-Math.random()*4).toFixed(1)}s`;
    box.appendChild(s);
  }
  document.body.insertBefore(box, document.getElementById("app"));
})();

/* ===== СТАРТ ===== */
document.title=CONFIG.shopName;
document.getElementById("splashName").textContent=CONFIG.shopName;
/* Ссылки из бота: ...#giveaway — страница розыгрыша, ...#gwadmin — управление розыгрышами */
const startHash=(location.hash||"").replace("#","");
if (["giveaway","gwadmin","games","panel"].includes(startHash)) view=startHash;
initGifts(); applyTheme(); render();
/* «Купить ещё» из бота: ...#stars / ...#premium — сразу открываем окно покупки */
(async()=>{ await sync(); if (startHash==="stars") openStars(); else if (startHash==="premium") openPremium(); })();
onEnter(view); if(view!=="home") loadGw(true);
setTimeout(()=>document.getElementById("splash").classList.add("hide"), S.noanim?400:1900);
</script>
