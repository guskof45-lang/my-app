<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Моё мини-приложение</title>
  <!-- Библиотека Telegram: без неё приложение не "знает", что открыто в Telegram -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 24px;
      text-align: center;
      /* Цвета берутся из темы Telegram пользователя */
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
    }
    h1 { font-size: 26px; margin-top: 40px; }
    p  { color: var(--tg-theme-hint-color, #888888); }
    button {
      margin-top: 24px;
      padding: 14px 28px;
      font-size: 17px;
      border: none;
      border-radius: 12px;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      cursor: pointer;
    }
    #counter { font-size: 48px; margin-top: 16px; }
  </style>
</head>
<body>
  <h1 id="hello">Привет! 👋</h1>
  <p>Это моё первое мини-приложение в Telegram</p>

  <div id="counter">0</div>
  <button id="btn">Нажми меня</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();    // сообщаем Telegram, что приложение загрузилось
    tg.expand();   // раскрываем на весь экран

    // Если приложение открыто в Telegram — здороваемся по имени
    const user = tg.initDataUnsafe && tg.initDataUnsafe.user;
    if (user && user.first_name) {
      document.getElementById("hello").textContent = "Привет, " + user.first_name + "! 👋";
    }

    // Простой счётчик нажатий
    let count = 0;
    document.getElementById("btn").addEventListener("click", function () {
      count++;
      document.getElementById("counter").textContent = count;
      if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light"); // лёгкая вибрация на телефоне
    });
  </script>
</body>
</html>
