  if(!CLV) CLV=climbLevel();
  const L=TEST?climbTestLevel():CLV, uz=S.lang==="uz";
  const {c,x,W,H,hint}=makeCanvas(area); if(hint) hint.remove(); c.style.touchAction="none";
  const KEY="climb_v3";
  let saved=null; try{ saved=JSON.parse(localStorage.getItem(KEY)||"null");
    if(!saved){ const o=JSON.parse(localStorage.getItem("climb_v2")||"null"); if(o) saved={best:o.best||0,gems:o.gems||[],everDone:!!o.everDone,done:true}; } }catch(e){}
  if(TEST) saved=null;
  const P={x:90,y:-CL.R-1,vx:0,vy:0}, O={x:60,y:-60}, Ot={x:60,y:-60};
  let ms=0, falls=0, best=0, peak=0, sentBest=0, lastSend=0, done=false, sect=-1, sectT=0, quote="", quoteT=0, grounded=false;
  let gemsGot=[], wasDone=false, shake=0, flash=0, paused=false;
  if(saved){ gemsGot=saved.gems||[]; best=saved.best||0; wasDone=!!saved.everDone;
    if(!saved.done){ Object.assign(P,saved.P); P.vx=P.vy=0; Object.assign(O,saved.O); Object.assign(Ot,saved.O); ms=saved.ms||0; falls=saved.falls||0; } }
  peak=heightOf(P.y); sentBest=best;
  const Hh={x:P.x+O.x,y:P.y+O.y}; let hc=false, hnx=0, hny=-1, hmat="stone", sliding=0;
  const scale=W/430; let camX=P.x, camY=P.y-40;
  const chunks=clChunks(L,scale), backs=[];
  function heightOf(y){ return Math.max(0,Math.round((-y-CL.R)/CL.PX)); }
  function near(y){ const k=Math.floor(y/100); const out=[]; for(let i=k-1;i<=k+1;i++){ const g=L.grid.get(i); if(g) for(const s of g) out.push(s); } return out; }
  function push(px,py,r){
    let hit=false, nx=0, ny=0, mat=null, best_d=1e9;
    for(let it=0; it<4; it++){ let moved=false;
      for(const s of near(py)){
        const dx=s.bx-s.ax, dy=s.by-s.ay, l2=dx*dx+dy*dy||1; let t=((px-s.ax)*dx+(py-s.ay)*dy)/l2; t=t<0?0:t>1?1:t;
        const qx=s.ax+dx*t, qy=s.ay+dy*t; let ex=px-qx, ey=py-qy; const d=Math.hypot(ex,ey);
        if(d<r && d>1e-6){ ex/=d; ey/=d; px+=ex*(r-d); py+=ey*(r-d); nx+=ex; ny+=ey; hit=true; moved=true; if(d<best_d){ best_d=d; mat=s.mat; } }
      }
      if(!moved) break;
    }
    const nl=Math.hypot(nx,ny)||1; return {x:px,y:py,nx:nx/nl,ny:ny/nl,hit,mat:mat||"stone"};
  }
  function sweep(fx,fy,tx,ty,r){
    const dist=Math.hypot(tx-fx,ty-fy), n=Math.max(1,Math.ceil(dist/3));
    for(let i=1;i<=n;i++){ const qx=fx+(tx-fx)*i/n, qy=fy+(ty-fy)*i/n; const p=push(qx,qy,r); if(p.hit) return {...p,blocked:true}; }
    return {x:tx,y:ty,blocked:false,hit:false};
  }
  function slide(fx,fy,tx,ty,r){
    const dist=Math.hypot(tx-fx,ty-fy), n=Math.max(1,Math.ceil(dist/3)), sx=(tx-fx)/n, sy=(ty-fy)/n;
    let px=fx, py=fy, hit=false, nx=0, ny=0, mat="stone";
    for(let i=0;i<n;i++){ const q=push(px+sx,py+sy,r); px=q.x; py=q.y; if(q.hit){ hit=true; nx=q.nx; ny=q.ny; mat=q.mat; } }
    return {x:px,y:py,hit,nx,ny,mat};
  }
  // ввод: палец как тачпад
  let lx=0, ly=0, down=false, touchedOnce=!!saved;
  const pd=e=>{ if(paused) return; clAudio(); down=true; touchedOnce=true; lx=e.clientX; ly=e.clientY; c.setPointerCapture&&c.setPointerCapture(e.pointerId); };
  const pm=e=>{ if(!down||done||paused) return; const k=1.15/scale; Ot.x+=(e.clientX-lx)*k; Ot.y+=(e.clientY-ly)*k; lx=e.clientX; ly=e.clientY; clampOt(); };
  const pu=()=>{ down=false; };
  function clampOt(){ const l=Math.hypot(Ot.x,Ot.y)||1; if(l>CL.LMAX){ Ot.x*=CL.LMAX/l; Ot.y*=CL.LMAX/l; } if(l<CL.LMIN){ Ot.x*=CL.LMIN/l; Ot.y*=CL.LMIN/l; } }
  c.addEventListener("pointerdown",pd); c.addEventListener("pointermove",pm); c.addEventListener("pointerup",pu); c.addEventListener("pointercancel",pu);

  function bodyFollow(tx,ty,dt){       // казан следует за закреплённым капгиром; скорость сохраняется → инерция
    const b=slide(P.x,P.y,tx,ty,CL.R);
    let vx=(b.x-P.x)/dt*CLD.FLING, vy=(b.y-P.y)/dt*CLD.FLING; const sp=Math.hypot(vx,vy); if(sp>CLD.VMAX){ vx*=CLD.VMAX/sp; vy*=CLD.VMAX/sp; }
    P.vx=vx; P.vy=vy; P.x=b.x; P.y=b.y;
  }
  function step(dt){
    clampOt();
    const mx=Ot.x-O.x, my=Ot.y-O.y, ml=Math.hypot(mx,my), maxd=CLD.HSPEED*dt;
    if(ml>maxd){ O.x+=mx/ml*maxd; O.y+=my/ml*maxd; } else { O.x=Ot.x; O.y=Ot.y; }
    const Hdx=P.x+O.x, Hdy=P.y+O.y;
    let anchored=false; sliding=Math.max(0,sliding-dt*4);
    if(hc){
      const dx=Hdx-Hh.x, dy=Hdy-Hh.y, dn=dx*hnx+dy*hny;
      if(dn>1.2) hc=false;                                                   // отвёл от поверхности — отцепился
      else {
        const tx=dx-hnx*dn, ty=dy-hny*dn, tl=Math.hypot(tx,ty), mu=(MAT[hmat]||MAT.stone).tool*CLD.TOOLMU;
        const allow=tl-mu*Math.max(0,-dn)-0.5;                                // трение капгира: держит, пока тянешь «в» поверхность
        if(allow>0&&tl>0){ const q=push(Hh.x+tx/tl*allow,Hh.y+ty/tl*allow,CL.HR);
          if(q.hit){ Hh.x=q.x; Hh.y=q.y; hnx=q.nx; hny=q.ny; hmat=q.mat; sliding=Math.min(1,sliding+allow*.3); } else hc=false; }
        if(hc){ bodyFollow(Hh.x-O.x,Hh.y-O.y,dt); anchored=true; if(Math.hypot(Hh.x-P.x,Hh.y-P.y)>CL.ARMMAX) hc=false; }
      }
    }
    if(!hc){
      const pvx=Hh.x, pvy=Hh.y, h=sweep(Hh.x,Hh.y,Hdx,Hdy,CL.HR);
      Hh.x=h.x; Hh.y=h.y;
      if(h.blocked){ hc=true; hnx=h.nx; hny=h.ny; hmat=h.mat; const imp=Math.hypot(Hdx-pvx,Hdy-pvy)/dt*.5+Math.hypot(P.vx,P.vy)*.6;
        clImpact((MAT[h.mat]||MAT.stone).snd,imp); if(imp>500){ shake=Math.min(6,imp/150); }
        bodyFollow(Hh.x-O.x,Hh.y-O.y,dt); anchored=true; }
    }
    if(!anchored){
      P.vy+=CLD.G*dt; P.vx*=0.9995;
      const b=slide(P.x,P.y,P.x+P.vx*dt,P.y+P.vy*dt,CL.R); P.x=b.x; P.y=b.y;
      grounded=false;
      if(b.hit){ const vn=P.vx*b.nx+P.vy*b.ny;
        if(vn<0){ P.vx-=b.nx*vn; P.vy-=b.ny*vn; if(-vn>140){ clImpact((MAT[b.mat]||MAT.stone).snd,-vn); if(-vn>520){ shake=Math.min(8,-vn/120); haptic("medium"); } } }
        const f=(MAT[b.mat]||MAT.stone).body, tx=-b.ny, ty=b.nx, vt=P.vx*tx+P.vy*ty; P.vx-=tx*vt*(1-f); P.vy-=ty*vt*(1-f);
        if(b.ny<-0.45){ grounded=true; if(f<.95 && Math.hypot(P.vx,P.vy)<35){ P.vx=0; P.vy=0; } } }
      Hh.x=P.x+O.x; Hh.y=P.y+O.y; const q=push(Hh.x,Hh.y,CL.HR); if(q.hit){ Hh.x=q.x; Hh.y=q.y; }
    } else { const g=push(P.x,P.y+2,CL.R); grounded=g.hit&&g.ny<-0.45; }
    P.x=Math.max(CL.R,Math.min(CL.W-CL.R,P.x));
  }
  function fallCheck(){
    const h=heightOf(P.y);
    if(h>best) best=h;
    if(h>peak) peak=h;
    if(grounded){ const drop=peak-h;
      if(drop>=20){ falls++; const arr=CL_QUOTES[uz?"uz":"ru"]; quote=(drop>=120?"😈 ":"")+arr[Math.floor(Math.random()*arr.length)]; quoteT=4.5;
        const fl=(CLTOP&&CLTOP.top||[]).find(f=>!f.me&&f.height>h&&f.height<=peak); if(fl) quote+=` — ${fl.name} ${uz?"seni ko'rib turibdi 👀":"тебя видит 👀"}`;
        notify("error"); haptic("heavy"); }
      peak=h; }
    const sc=CL_ZONES.reduce((a,z,i)=>h>=z.m?i:a,0); if(sc!==sect){ if(sect>=0&&sc>sect&&!TEST){ sectT=3; notify(); } sect=sc; CLS.zone=sc; }
    L.gems.forEach(g=>{ if(!gemsGot.includes(g.i) && Math.hypot(g.x-P.x,g.y-P.y)<34){ gemsGot.push(g.i); notify(); haptic("medium"); clChime(); flash=1;
      quote=`💎 ${uz?"Kristall":"Кристалл"} ${gemsGot.length}/${L.gems.length}`; quoteT=2.5; save();
      if(LIVE) api("/api/climb/score","POST",{height:best,ms:Math.round(ms)}).catch(()=>{}).then(()=>api("/api/climb/gem","POST",{i:g.i})).then(r=>{ if(r&&r.prize){ quote+=` · +${r.prize} ${uz?"token":"токенов"}`; quoteT=2.5; } }).catch(()=>{}); } });
    const g=document.getElementById("gscore"); if(g) g.textContent=TEST?(uz?"Test":"Тест"):h+" м";
    const sm=L.summit; if(!done && !TEST && grounded && P.y<sm.y && P.x>sm.lx && P.x<sm.rx){ finish(); }
    if(!TEST && best>=sentBest+5 && LIVE && performance.now()-lastSend>6000){ lastSend=performance.now(); sentBest=best;
      api("/api/climb/score","POST",{height:best,ms:Math.round(ms)}).catch(()=>{}); }
  }
  function finish(){
    done=true; wasDone=true; save(); notify(); clFanfare();
    const sec=Math.round(ms/1000), t=`${Math.floor(sec/3600)}:${String(Math.floor(sec/60)%60).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`;
    const d=document.createElement("div"); d.className="clwin";
    d.innerHTML=`<canvas id="clWinHero" width="240" height="200"></canvas><h3>${uz?"Cho'qqi zabt etildi!":"Вершина покорена!"}</h3><p class="sub">${uz?"Bayroqqa yetib kelgan ozchilikdansiz":"Ты среди немногих, кто дошёл до флага"}</p>
      <div class="st"><div><i>⏱</i><b>${t}</b><span>${uz?"vaqt":"время"}</span></div><div><i>⤓</i><b>${falls}</b><span>${uz?"yiqilish":"падений"}</span></div><div><i>💎</i><b>${gemsGot.length}/${L.gems.length}</b><span>${uz?"kristall":"кристаллов"}</span></div></div>
      <div class="rw" id="clPrize"><b>${uz?"Mukofotlar":"Награды"}</b><span>🏆 ${uz?"«Zabt etuvchi» darajasi":"Ранг «Покоритель»"}</span><span>🥇 ${uz?"Oltin qozon abadiy":"Золотой казан навсегда"}</span></div>
      <button class="btn" onclick="climbRestart()">${uz?"Yana boshidan":"Пройти заново"}</button><button class="btn ghost" onclick="closeGame()">${t_("close")}</button>`;
    area.appendChild(d);
    const hc2=document.getElementById("clWinHero"), hx=hc2.getContext("2d"); hx.scale(1,1); clHero(hx,120,150,3.2,{gold:true});
    if(LIVE) api("/api/climb/finish","POST",{ms:Math.round(ms),falls}).then(r=>{ const p=document.getElementById("clPrize");
      if(p&&r.first) p.insertAdjacentHTML("beforeend",`<span>🎁 +${r.prize} ${uz?"token":"токенов"}</span>`); }).catch(()=>{});
  }
  function save(){ if(TEST) return; try{ localStorage.setItem(KEY,JSON.stringify({P:{x:P.x,y:P.y},O:{x:O.x,y:O.y},ms,falls,best,done,gems:gemsGot,everDone:wasDone})); }catch(e){} }
  function backdrop(i){ if(!backs[i]) backs[i]=clBackdrop(i,W,H); return backs[i]; }
  // частицы
  const parts=[]; const snowP=Array.from({length:50},()=>({x:Math.random()*W,y:Math.random()*H,v:20+Math.random()*30,s:Math.random()*1.6+.5}));
  function draw(now,dt){
    const h=heightOf(P.y);
    const tY=P.y-40+Math.max(-60,Math.min(90,P.vy*.12));                 // камера немного смотрит туда, куда летишь
    camX+=(P.x-camX)*Math.min(1,dt*6); camY+=(tY-camY)*Math.min(1,dt*5);
    const vw=W/scale, cx=Math.max(vw/2-40,Math.min(CL.W-vw/2+40,camX));
    // фон: текущая зона + плавный переход в следующую
    const zf=TEST?0:CL_ZONES.reduce((a,z,i)=>h>=z.m-12?i:a,0), z=CL_ZONES[zf], nz=CL_ZONES[zf+1];
    x.drawImage(backdrop(zf),0,0,W,H);
    if(nz){ const k=(h-(nz.m-12))/12+1; if(k>0&&k<1){ x.globalAlpha=k; x.drawImage(backdrop(zf+1),0,0,W,H); x.globalAlpha=1; } }
    // дрейфующие облака и снег
    if(zf>=5){ for(let i=0;i<4;i++){ const xx=((now/1000*(8+i*4)+i*160)%(W+300))-150; clCloud(x,xx,H*(.2+i*.18),120+i*30,.35); } }
    if(zf===4||zf===6){ x.fillStyle="rgba(255,255,255,.85)"; snowP.forEach(p=>{ p.y+=p.v*dt; p.x+=Math.sin(now/900+p.y/40)*10*dt; if(p.y>H){ p.y=-4; p.x=Math.random()*W; } x.beginPath(); x.arc(p.x,p.y,p.s,0,TAU); x.fill(); }); }
    const sx=(Math.random()-.5)*shake, sy=(Math.random()-.5)*shake; shake=Math.max(0,shake-dt*14);
    x.save(); x.translate(W/2+sx,H*0.55+sy); x.scale(scale,scale); x.translate(-cx,-camY);
    // гора из кэша кусков
    const y0=camY-H*0.6/scale, y1=camY+H*0.5/scale;
    for(let ci=Math.floor(y0/chunks.CH); ci<=Math.floor(y1/chunks.CH); ci++){ const cv=chunks.get(ci); x.drawImage(cv,-60,ci*chunks.CH,(CL.W+120),chunks.CH); }
    // лампы и дым трубы
    L.deco.forEach(d=>{ if(d.y<y0-200||d.y>y1+200) return;
      if(d.kind==="lamp"){ x.fillStyle=crg(x,d.x,d.y,2,110,[[0,"rgba(255,180,90,.35)"],[1,"rgba(255,180,90,0)"]]); x.fillRect(d.x-110,d.y-110,220,220); x.fillStyle="#ffd28a"; crr(x,d.x-12,d.y-3,24,6,3); x.fill(); }
      if(d.kind==="smoke"){ for(let i=0;i<6;i++){ const yy=d.y-((now/30+i*40)%240); x.fillStyle=`rgba(200,200,210,${.10*(1-((now/30+i*40)%240)/240)})`; x.beginPath(); x.arc(d.x+Math.sin(yy/30)*14,yy,14+i*3,0,TAU); x.fill(); } } });
    // кристаллы
    L.gems.forEach(gm=>{ if(gemsGot.includes(gm.i)||gm.y<y0||gm.y>y1) return; clGem(x,gm.x,gm.y+Math.sin(now/300+gm.i)*3,.85); });
    // флажки других игроков
    if(!TEST) (CLTOP&&CLTOP.top||[]).forEach(f=>{ const fy=-f.height*CL.PX-CL.R; if(fy<y0||fy>y1) return;
      x.strokeStyle=f.me?"#7fd6a4":"rgba(255,255,255,.6)"; x.lineWidth=1.5; x.beginPath(); x.moveTo(8,fy); x.lineTo(8,fy-26); x.stroke();
      x.fillStyle=f.me?"#7fd6a4":"#ffd36b"; x.beginPath(); x.moveTo(8,fy-26); x.lineTo(24,fy-21); x.lineTo(8,fy-16); x.fill();
      const lab=`${f.name} · ${f.height} м`; x.font="700 10px Manrope,sans-serif"; const lw=x.measureText(lab).width+12;
      x.fillStyle="rgba(10,8,16,.5)"; crr(x,28,fy-31,lw,16,8); x.fill(); x.fillStyle="#fff"; x.fillText(lab,34,fy-19); });
    // флаг вершины
    const sm=L.summit, fx=(sm.lx+sm.rx)/2+50;
    x.strokeStyle="#fff"; x.lineWidth=2.5; x.beginPath(); x.moveTo(fx,sm.y); x.lineTo(fx,sm.y-90); x.stroke();
    x.fillStyle="#141418"; x.beginPath(); x.moveTo(fx,sm.y-90); x.quadraticCurveTo(fx+40,sm.y-98,fx+76,sm.y-82+Math.sin(now/300)*3); x.lineTo(fx+76,sm.y-58+Math.sin(now/300)*3); x.quadraticCurveTo(fx+40,sm.y-70,fx,sm.y-62); x.fill();
    x.fillStyle="#ffd36b"; x.font="900 10px Manrope,sans-serif"; x.fillText("DRIP CLIMB",fx+8,sm.y-73);
    // пар над казаном
    if(Math.random()<.25) parts.push({x:P.x+(Math.random()-.5)*20,y:P.y-12,vy:-18-Math.random()*12,l:1});
    for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.y+=p.vy*dt; p.x+=Math.sin(now/300+i)*6*dt; p.l-=dt*.8; if(p.l<=0){ parts.splice(i,1); continue; }
      x.fillStyle=`rgba(255,255,255,${p.l*.18})`; x.beginPath(); x.arc(p.x,p.y,4+(1-p.l)*6,0,TAU); x.fill(); }
    // герой и капгир
    const lean=Math.max(-.25,Math.min(.25,P.vx*.0006)), tilt=Math.max(-.35,Math.min(.35,-P.vx*.0012+(P.vy>200?.1:0)));
    const shX=P.x+5, shY=P.y-15, ad=Math.hypot(Hh.x-shX,Hh.y-shY)||1, hx0=shX+(Hh.x-shX)/ad*12, hy0=shY+(Hh.y-shY)/ad*12;
    clHero(x,P.x,P.y+6,1.05,{gold:wasDone,lean,tilt,scared:P.vy>380});
    clKapgir(x,hx0,hy0,Hh.x,Hh.y,hc);
    x.strokeStyle="#1d3f8a"; x.lineWidth=5; x.lineCap="round"; x.beginPath(); x.moveTo(shX,shY); x.lineTo(hx0,hy0); x.stroke();
    x.fillStyle="#e0ad84"; x.beginPath(); x.arc(hx0,hy0,3,0,TAU); x.fill();
    x.restore();
    if(flash>0){ x.fillStyle=`rgba(160,240,255,${flash*.35})`; x.fillRect(0,0,W,H); flash=Math.max(0,flash-dt*2.5); }
    hud(h);
  }
  function glass(X,Y,w,h,r=14,a=.38){ x.fillStyle=`rgba(12,10,18,${a})`; crr(x,X,Y,w,h,r); x.fill(); x.strokeStyle="rgba(255,255,255,.14)"; x.lineWidth=1; x.stroke(); }
  function hud(h){
    x.textAlign="left";
    if(TEST){ glass(12,12,200,40); x.fillStyle="#fff"; x.font="900 15px Manrope,sans-serif"; x.fillText(uz?"🧪 Test xonasi":"🧪 Тест-комната",24,37); return; }
    glass(12,12,214,56); x.fillStyle="#fff"; x.font="900 24px Manrope,sans-serif"; x.fillText(h+" м",24,44);
    x.font="600 10.5px Manrope,sans-serif"; x.fillStyle="rgba(255,255,255,.7)"; x.fillText((uz?"REKORD ":"РЕКОРД ")+best+" м",24,59);
    const rk=clRank(best,wasDone).toUpperCase(); x.font="800 10.5px Manrope,sans-serif"; const kw=x.measureText(rk).width+16;
    x.fillStyle="rgba(255,211,107,.18)"; crr(x,110,30,kw,20,10); x.fill(); x.strokeStyle="rgba(255,211,107,.6)"; x.stroke(); x.fillStyle="#ffd36b"; x.fillText(rk,118,44);
    glass(12,74,214,26,11,.3); const sec=Math.round(ms/1000);
    x.font="700 11.5px Manrope,sans-serif"; x.fillStyle="rgba(255,255,255,.88)"; x.fillText(`⏱ ${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}    ⤓ ${falls}    💎 ${gemsGot.length}/${L.gems.length}`,24,92);
    // шкала высоты справа
    const bx=W-16, by=H*.2, bh=H*.6; x.fillStyle="rgba(255,255,255,.14)"; crr(x,bx-2,by,4,bh,2); x.fill();
    CL_ZONES.forEach(zz=>{ x.fillStyle="rgba(255,255,255,.45)"; x.fillRect(bx-6,by+bh*(1-zz.m/CL.SUMMIT),8,1.5); });
    x.fillStyle="#ffd36b"; x.beginPath(); x.moveTo(bx-8,by); x.lineTo(bx+4,by-6); x.lineTo(bx+4,by+6); x.fill();
    x.strokeStyle="#7fd6a4"; x.lineWidth=2; const byB=by+bh*(1-Math.min(best,CL.SUMMIT)/CL.SUMMIT); x.beginPath(); x.moveTo(bx-8,byB); x.lineTo(bx+6,byB); x.stroke();
    x.fillStyle="#fff"; x.shadowColor="#fff"; x.shadowBlur=8; x.beginPath(); x.arc(bx,by+bh*(1-Math.min(h,CL.SUMMIT)/CL.SUMMIT),5,0,TAU); x.fill(); x.shadowBlur=0;
    const si=Math.max(0,sect);
    if(sectT>0){ x.globalAlpha=Math.min(1,sectT); x.textAlign="center"; x.font="900 24px Manrope,sans-serif"; x.fillStyle="#fff"; x.shadowColor="rgba(0,0,0,.5)"; x.shadowBlur=12;
      x.fillText(CL_ZONES[si][uz?"uz":"ru"],W/2,H*.22); x.font="700 12px Manrope,sans-serif"; x.fillText(`${CL_ZONES[si].m} ${uz?"m":"м"}`,W/2,H*.22+20); x.shadowBlur=0; x.textAlign="left"; x.globalAlpha=1; }

function makeCanvas(area){
  const c=document.createElement("canvas"), x=c.getContext("2d"), dpr=Math.min(window.devicePixelRatio||1,2);
  const W=area.clientWidth, H=area.clientHeight;
  c.width=W*dpr; c.height=H*dpr; c.style.width=W+"px"; c.style.height=H+"px"; x.setTransform(dpr,0,0,dpr,0,0);
  area.appendChild(c);
  const hint=document.createElement("div"); hint.className="ghint"; hint.textContent=t("hint_move"); area.appendChild(hint);
  return {c,x,W,H,hint};
}
function pointerX(c,cb){
  const f=e=>{ const r=c.getBoundingClientRect(); const p=e.touches?e.touches[0]:e; cb(p.clientX-r.left,p.clientY-r.top); };
  c.addEventListener("pointermove",f); c.addEventListener("pointerdown",f);
  c.addEventListener("touchmove",e=>{f(e);e.preventDefault();},{passive:false});
}
function bgStars(W,H){ return Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.6+.3,v:Math.random()*1.2+.3})); }
function drawBg(x,W,H,st){
  x.fillStyle="#030304"; x.fillRect(0,0,W,H);
  st.forEach(s=>{ s.y+=s.v; if(s.y>H){s.y=0;s.x=Math.random()*W;} x.globalAlpha=s.s/2; x.fillStyle="#fff"; x.fillRect(s.x,s.y,s.s,s.s); }); x.globalAlpha=1;
}
function burst(parts,px,py,n=12){ for(let i=0;i<n;i++){ const a=Math.random()*6.28,v=Math.random()*4+1; parts.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:30}); } }
function drawParts(x,parts){ for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.x+=p.vx; p.y+=p.vy; p.l--; x.globalAlpha=p.l/30; x.fillStyle="#fff"; x.fillRect(p.x,p.y,2,2); if(p.l<=0) parts.splice(i,1); } x.globalAlpha=1; }

/* --- Игра: Sky Dash (бесплатная). Нажатие — ракета подлетает вверх, иначе падает. --- */
function gSkyDash(area,ui){
  const {c,x,W,H,hint}=makeCanvas(area); hint.textContent=t("hint_sd");
  const st=bgStars(W,H), R=13;
  const P={x:Math.max(70,W*.26),y:H*.45,vy:0};
  let obs=[], bonus=null, parts=[], started=false, alive=true, deathT=0, raf, last=performance.now();
  let time=0, score=0, toNext=0, shield=0, nextShield=25+Math.random()*10, banner="", bannerT=0, flame=0;
  const flap=()=>{ if(!alive) return; started=true; P.vy=-6.1; flame=8; haptic(); hint.style.opacity=0; };
  let prevCy=H*.45, stars=[], rot=0, acc=0, milestone=0;
  c.addEventListener("pointerdown",flap);
  const key=e=>{ if(e.code==="Space"||e.key==="ArrowUp"){ e.preventDefault(); flap(); } }; document.addEventListener("keydown",key);
  // Сложность растёт: за ~2.5 минуты от лёгкой до тяжёлой, дальше продолжает ускоряться
  const level=()=>Math.min(1,time/150);
  const speed=()=>3.0+level()*3.2+Math.min(1.6,Math.max(0,time-150)*0.008);
  const gapH=()=>Math.max(135,210-level()*70);
  function spawn(){
    const L=level(), r=Math.random(), g=gapH(), m=50;
    const maxShift=Math.min(H*.42, 120+L*60);           // проход не «прыгает» через весь экран
    let cy=prevCy+(Math.random()*2-1)*maxShift;
    const lo=m+g/2+70, hi=H-m-g/2-70; cy=Math.max(lo,Math.min(hi,cy)); prevCy=cy;
    let type="pipe";                                   // колонны сверху и снизу с проходом
    if(L>0.12 && r<0.2+L*0.25) type="move";            // проход ездит вверх-вниз
    else if(L>0.3 && r<0.62) type="rock";              // астероиды
    else if(L>0.5 && r<0.75) type="narrow";            // узкий длинный проход
    if(type==="rock"){
      const n=L>0.65?2:1;
      for(let i=0;i<n;i++) obs.push({type,x:W+30+i*130,y:Math.max(60,Math.min(H-60,prevCy+(Math.random()*2-1)*120+(i?90:0))),r:14+Math.random()*11,vy:(Math.random()-.5)*(.8+L),passed:false});
    } else { obs.push({type,x:W+30,w:type==="narrow"?120:54,cy,g:type==="narrow"?Math.max(145,g+10):g,amp:type==="move"?20+L*40:0,ph:Math.random()*6.28,passed:false});
      if(Math.random()<.45) stars.push({x:W+30+(type==="narrow"?60:27),y:cy,o:obs[obs.length-1]}); }
    if(type==="pipe" && !bonus && time>=nextShield){ bonus={x:W+30+27,y:cy}; nextShield=time+55+Math.random()*15; }
    toNext=Math.max(185,300-L*105)*(type==="narrow"?1.25:1);
  }
  const gapY=o=>o.cy+Math.sin(time*1.7+o.ph)*o.amp;
  function die(){
    if(shield>0) return false;
    alive=false; deathT=45; haptic("heavy"); burst(parts,P.x,P.y,28); return true;
  }
  function drawRocket(){
    rot+=(Math.max(-.45,Math.min(.75,P.vy*.08))-rot)*.18;
    x.save(); x.translate(P.x,P.y); x.rotate(rot);
    if(flame>0||!started){ x.fillStyle="rgba(255,255,255,"+(.35+Math.random()*.4)+")"; x.beginPath(); x.moveTo(-14,-4); x.lineTo(-24-Math.random()*8,0); x.lineTo(-14,4); x.fill(); }
    x.shadowColor="#fff"; x.shadowBlur=12;
    const gr=x.createLinearGradient(0,-8,0,8); gr.addColorStop(0,"#ffffff"); gr.addColorStop(1,"#8d919c");
    x.fillStyle=gr; x.beginPath(); x.moveTo(18,0); x.quadraticCurveTo(8,-9,-12,-7); x.lineTo(-12,7); x.quadraticCurveTo(8,9,18,0); x.fill();
    x.fillStyle="#c9ccd4"; x.beginPath(); x.moveTo(-8,-7); x.lineTo(-16,-13); x.lineTo(-13,-6); x.fill(); x.beginPath(); x.moveTo(-8,7); x.lineTo(-16,13); x.lineTo(-13,6); x.fill();
    x.shadowBlur=0; x.fillStyle="#050506"; x.beginPath(); x.arc(5,0,3,0,6.283); x.fill();
    x.restore();
    if(shield>0){ x.strokeStyle="rgba(255,255,255,"+(shield<2?(.3+.3*Math.sin(time*25)):.65)+")"; x.lineWidth=2; x.beginPath(); x.arc(P.x,P.y,R+11,0,6.283); x.stroke(); }
  }
  function drawCol(xx,y,w,h){ x.fillStyle="rgba(255,255,255,.09)"; x.strokeStyle="#e8e9ee"; x.lineWidth=2; x.fillRect(xx,y,w,h); x.strokeRect(xx,y,w,h); }
  function loop(now){
    acc+=Math.min(4,(now-last)/16.67||1); last=now; const dt=1;
    drawBg(x,W,H,st);
    while(acc>=1){ acc-=1; update(now); }
    function update(now){
    if(started && alive){
      time+=dt/60; if(shield>0) shield=Math.max(0,shield-dt/60); if(flame>0) flame-=dt;
      P.vy=Math.min(8.5,P.vy+0.34*dt); P.y+=P.vy*dt;
      const sp=speed()*dt; toNext-=sp; if(toNext<=0) spawn();
      if(P.y<R){ P.y=R; P.vy=Math.max(0,P.vy); }
      if(P.y>H-R){ P.y=H-R; P.vy=0; if(!shield) die(); }
      for(let i=obs.length-1;i>=0;i--){
        const o=obs[i]; o.x-=sp;
        if(o.type==="rock"){
          o.y+=o.vy*dt; if(o.y<o.r||o.y>H-o.r) o.vy*=-1;
          if(alive && Math.hypot(o.x-P.x,o.y-P.y)<o.r+R-4){ if(!die()){ burst(parts,o.x,o.y,14); obs.splice(i,1); continue; } }
          if(!o.passed && o.x+o.r<P.x){ o.passed=true; score++; }
          if(o.x<-60) obs.splice(i,1);
        } else {
          const gy=gapY(o), top=gy-o.g/2, bot=gy+o.g/2;
          if(alive && P.x+R>o.x && P.x-R<o.x+o.w && (P.y-R+3<top || P.y+R-3>bot)) die();
          if(!o.passed && o.x+o.w<P.x){ o.passed=true; score++; }
          if(o.x+o.w<-20) obs.splice(i,1);
        }
      }
      if(bonus){ bonus.x-=sp; if(Math.hypot(bonus.x-P.x,bonus.y-P.y)<R+16){ shield=10; banner=t("b_shield")+" 10s"; bannerT=90; notify(); burst(parts,bonus.x,bonus.y,16); bonus=null; } else if(bonus.x<-30) bonus=null; }
      for(let i=stars.length-1;i>=0;i--){ const z=stars[i]; z.x-=sp; const zy=z.o.type==="move"?gapY(z.o):z.y;
        if(Math.hypot(z.x-P.x,zy-P.y)<R+12){ score++; burst(parts,z.x,zy,8); haptic(); stars.splice(i,1); } else if(z.x<-20) stars.splice(i,1); }
      if(score>=milestone+10){ milestone=Math.floor(score/10)*10; banner=`${milestone}!`; bannerT=60; }
    } else if(!started){ P.y=H*.45+Math.sin(now/300)*6; }
    }
    // рисуем препятствия
    x.shadowColor="#fff"; x.shadowBlur=6;
    obs.forEach(o=>{
      if(o.type==="rock"){ x.fillStyle="rgba(255,255,255,.1)"; x.strokeStyle="#e8e9ee"; x.lineWidth=2; x.beginPath(); x.arc(o.x,o.y,o.r,0,6.283); x.fill(); x.stroke();
        x.beginPath(); x.arc(o.x-o.r*.3,o.y-o.r*.2,o.r*.22,0,6.283); x.stroke(); }
      else { const gy=gapY(o); drawCol(o.x,-4,o.w,gy-o.g/2+4); drawCol(o.x,gy+o.g/2,o.w,H-(gy+o.g/2)+4); }
    });
    x.shadowBlur=0;
    if(bonus){ x.save(); x.translate(bonus.x,bonus.y+Math.sin(now/200)*4); x.shadowColor="#fff"; x.shadowBlur=18; x.strokeStyle="#fff"; x.lineWidth=2.4;
      x.beginPath(); x.arc(0,0,14,0,6.283); x.stroke(); x.beginPath(); x.moveTo(0,-8); x.lineTo(7,-4); x.lineTo(6,4); x.lineTo(0,9); x.lineTo(-6,4); x.lineTo(-7,-4); x.closePath(); x.stroke(); x.restore(); }
    stars.forEach(z=>{ const zy=z.o.type==="move"?gapY(z.o):z.y; x.save(); x.translate(z.x,zy); x.rotate(now/400); x.fillStyle="#ffd36b";
      x.beginPath(); for(let k=0;k<10;k++){ const rr=k%2?4.5:10, a=k/10*6.283-1.57; x.lineTo(Math.cos(a)*rr,Math.sin(a)*rr); } x.closePath(); x.fill(); x.restore(); });
    if(alive) drawRocket();
    drawParts(x,parts);
    if(shield>0){ x.fillStyle="rgba(255,255,255,.75)"; x.font="700 12px Manrope,sans-serif"; x.textAlign="right"; x.fillText(t("b_shield")+" "+Math.ceil(shield)+"s",W-14,24); }
    if(bannerT>0){ bannerT-=dt; x.globalAlpha=Math.min(1,bannerT/30); x.fillStyle="#fff"; x.font="800 20px Unbounded,sans-serif"; x.textAlign="center"; x.fillText(banner,W/2,H*.3); x.globalAlpha=1; }
    ui.score(score);
    if(!alive){ deathT-=dt; if(deathT<=0){ ui.over(score); return; } }
    raf=requestAnimationFrame(loop);
  }
  raf=requestAnimationFrame(loop);
  return ()=>{ alive=false; deathT=-1; cancelAnimationFrame(raf); document.removeEventListener("keydown",key); };
}

/* --- Игра 3: 2048 --- */
function g2048(area,ui){
  let b=Array(16).fill(0), score=0, alive=true;
  const box=document.createElement("div"); box.className="g2048"; area.appendChild(box);
  const hint=document.createElement("div"); hint.className="ghint"; hint.textContent=t("hint_swipe"); area.appendChild(hint);
  function add(){ const e=b.map((v,i)=>v?-1:i).filter(i=>i>=0); if(!e.length) return; b[e[Math.floor(Math.random()*e.length)]]=Math.random()<.9?2:4; }
  function color(v){ if(!v) return ["rgba(255,255,255,.04)","#fff"]; const l=Math.log2(v); const c=Math.min(255,25+l*21); return [`rgb(${c},${c},${c+4})`, l>=6?"#050506":"#fff"]; }
  function draw(pop=-1){
    box.innerHTML=b.map((v,i)=>{ const [bg,fg]=color(v), fs=v>=1024?16:v>=128?20:24;
      return `<div class="${i===pop?"pop":""}" style="background:${bg};color:${fg};font-size:${fs}px;${v>=256?"box-shadow:0 0 18px rgba(255,255,255,.35)":""}">${v||""}</div>`; }).join("");
  }
  function line(a){ let r=a.filter(v=>v), gain=0; for(let i=0;i<r.length-1;i++){ if(r[i]===r[i+1]){ r[i]*=2; gain+=r[i]; r.splice(i+1,1);} } while(r.length<4) r.push(0); return [r,gain]; }
  function move(d){
    if(!alive) return; let moved=false;
    for(let k=0;k<4;k++){
      let idx=[0,1,2,3].map(j=> d==="L"?k*4+j : d==="R"?k*4+3-j : d==="U"?j*4+k : (3-j)*4+k);
      const [r,g]=line(idx.map(i=>b[i])); score+=g;
      idx.forEach((i,j)=>{ if(b[i]!==r[j]) moved=true; b[i]=r[j]; });
    }
    if(moved){ add(); draw(); ui.score(score); haptic(); hint.style.opacity=0; }
    if(!canMove()){ alive=false; setTimeout(()=>ui.over(score),400); }
  }
  function canMove(){ if(b.includes(0)) return true; for(let i=0;i<16;i++){ if(i%4<3&&b[i]===b[i+1]) return true; if(i<12&&b[i]===b[i+4]) return true; } return false; }
  let sx=0,sy=0;
  const down=e=>{ sx=e.clientX; sy=e.clientY; };
  const up=e=>{ const dx=e.clientX-sx, dy=e.clientY-sy; if(Math.max(Math.abs(dx),Math.abs(dy))<28) return; move(Math.abs(dx)>Math.abs(dy)?(dx>0?"R":"L"):(dy>0?"D":"U")); };
  const key=e=>{ const m={ArrowLeft:"L",ArrowRight:"R",ArrowUp:"U",ArrowDown:"D"}[e.key]; if(m){ e.preventDefault(); move(m);} };
  area.addEventListener("pointerdown",down); area.addEventListener("pointerup",up); document.addEventListener("keydown",key);
  add(); add(); draw();
  return ()=>{ alive=false; document.removeEventListener("keydown",key); };
}
